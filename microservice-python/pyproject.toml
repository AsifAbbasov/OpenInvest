[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openinvest-analytics"
version = "0.1.0"
description = "OpenInvest analytics worker skeleton"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.137.2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["openinvest_analytics"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
