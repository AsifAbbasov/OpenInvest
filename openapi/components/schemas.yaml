          $ref: "#/AssetListData"

AssetResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/Asset"

PortfolioListResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/PortfolioListData"

PortfolioResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/Portfolio"

PortfolioDeletionResponse:
  allOf:
    - $ref: "#/BaseResponse"
