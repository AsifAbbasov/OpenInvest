          $ref: "#/PortfolioDeletionResult"

PortfolioSummaryResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/PortfolioSummary"

SnapshotListResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/SnapshotListData"

TransactionListResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/TransactionListData"

TransactionResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
