          $ref: "#/TransactionReversal"

ImportReviewResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/ImportReviewResult"

ImportAppendResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
        data:
          $ref: "#/ImportAppendResult"

DividendCalendarResponse:
  allOf:
    - $ref: "#/BaseResponse"
    - type: object
      properties:
