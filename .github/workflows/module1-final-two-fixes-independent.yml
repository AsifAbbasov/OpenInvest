name: AUTH-ADV independent final two-fixes verification
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-postgres-red-to-green:
    name: original renewal RED and worker/rollback adversarial matrix
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout exact independent audit SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact audit commit and tree
        env:
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Migrate PostgreSQL 18
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Re-run original independent oracles and focused invariants
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -uo pipefail
          go test ./internal/postgres -list '^TestEmailOwnership(Final|Extended|Independent)' > /tmp/independent-discovery.txt
          if [ "$?" -ne 0 ]; then echo "HARNESS_COMPILATION_FAILURE"; exit 23; fi
          cat /tmp/independent-discovery.txt
          for expected in TestEmailOwnershipFinalRenewalWhilePriorLeaseUnfinished TestEmailOwnershipFinalReplacementLeaseAndStaleCallbacks TestEmailOwnershipFinalExhaustionConcurrentRecoveryAndLateCompletion TestEmailOwnershipFinalMultiPointTransactionalFaultInjection TestEmailOwnershipFinalIntentExpiryRejectsLateProof TestEmailOwnershipIndependentFourthCrashTerminalState TestEmailOwnershipExtendedWorkerCrashOrderMatrix TestEmailOwnershipExtendedLegacyFinancialLedgerImmutableOnTakeover; do
            grep -qx "$expected" /tmp/independent-discovery.txt || { echo "MISSING_REQUIRED_INDEPENDENT_TEST=$expected"; exit 24; }
          done
          failures=0
          run_case() {
            name="$1"; pattern="$2"; echo "::group::$name"
            go test -race -v ./internal/postgres -run "^TestEmailOwnership$pattern$" -count=1 -timeout=3m
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "INDEPENDENT_CASE_FAILURE=$name EXIT=$code"
              failures=$((failures + 1))
            else
              echo "INDEPENDENT_CASE_SUCCESS=$name"
            fi
          }
          run_case original_renewal_red_to_green FinalRenewalWhilePriorLeaseUnfinished
          run_case original_stale_and_replacement FinalReplacementLeaseAndStaleCallbacks
          run_case exhausted_16_worker_concurrent_recovery FinalExhaustionConcurrentRecoveryAndLateCompletion
          run_case sql_faults_six_points FinalMultiPointTransactionalFaultInjection
          run_case expired_intent FinalIntentExpiryRejectsLateProof
          run_case original_fourth_crash IndependentFourthCrashTerminalState
          run_case extended_worker_crash_orders ExtendedWorkerCrashOrderMatrix
          run_case extended_legacy_financial_isolation ExtendedLegacyFinancialLedgerImmutableOnTakeover
          run_case independent_ownership_regressions '(IndependentLegacyAccountCannotBeReclaimed|IndependentGenerationInvalidatesOldToken|IndependentConcurrentTokenConsumption)'
          run_case registration_capacity_and_timing '(ExtendedCapacity10000FailClosedAndRecovery|ExtendedTimingEnumerationBoundedDiagnostic)'
          echo "FOCUSED_POSTGRES_FAILED_CASES=$failures"
          exit "$failures"
  independent-mounted-frontend-red-to-green:
    name: original frontend RED + navigation lifecycle mounted components
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact independent audit SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact audit commit and tree
        env:
          AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - name: Install pinned dependencies
        working-directory: frontend-next
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
      - name: Run ORIGINAL independent mounted RED oracles unchanged
        working-directory: frontend-next
        run: |
          set -euo pipefail
          node --experimental-loader ./tests/css-module-loader.mjs --import tsx --test tests/email-verification-adversarial.component.test.tsx tests/module1-verification-stale-principal.redteam.test.tsx tests/module1-final-navigation-independently-strengthened.test.tsx
