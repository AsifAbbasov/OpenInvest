name: Stage 3.74 docs closure

on:
  push:
    branches:
      - docs/stage-03-74-runtime-closure

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/stage-03-74-runtime-closure
          fetch-depth: 0
      - name: Apply post-merge documentation closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          MERGE = "0580bf7e98c532202f84bbf9ceacd97aedbe4140"
          HEAD = "ff6d3efb8bb0d63f8cab55ac82fdf1052946aa02"
          RUN = "34117662576"

          def read(path):
              return Path(path).read_text()
          def write(path, text):
              Path(path).write_text(text)
          def sub_required(text, pattern, repl, label, flags=re.M):
              new, n = re.subn(pattern, repl, text, flags=flags)
              if n == 0 and repl not in text:
                  raise SystemExit(f"missing expected anchor: {label}")
              return new

          for path in [
              "docs/ROADMAP.md",
              "docs/SOURCE_OF_TRUTH.md",
              "docs/DOCUMENT_INDEX.md",
              "docs/IMPLEMENTATION_LOG.md",
              "docs/CHANGELOG.md",
              "docs/VERSION_MATRIX.md",
              "docs/OPEN_QUESTIONS.md",
          ]:
              text = read(path).replace("Stage 3.74+", "Stage 3.75+")
              write(path, text)

          path = "README.md"
          text = read(path)
          text = sub_required(
              text,
              r"Stage 3 is canonically implemented through \*\*Stage 3\.73 — Portfolio Time Machine / Historical Position View\*\*; Stage 3\.74 Transaction Correction & Reversal / Ledger Repair UX is the current reviewed implementation candidate\.",
              "Stage 3 is canonically implemented through **Stage 3.74 — Transaction Correction & Reversal / Ledger Repair UX**.",
              "README frontier",
          )
          text = sub_required(
              text,
              r"Stage 3\.68 Dividend Calculator and Stages 3\.71–3\.73 portfolio position/cost-basis and Time Machine views are canonical; Stage 3\.73 is protected-merged through PR #148 at `683f9c4647f888bb3dbdfb9dd365b84b95137b46` after exact-head CI #424 on `a74fd85a46843ccdfe8192f2ac8687169a5a2ac7` completed 10/10 SUCCESS\.",
              f"Stage 3.68 Dividend Calculator and Stages 3.71–3.74 portfolio position/cost-basis, Time Machine and immutable transaction-repair flows are canonical; Stage 3.74 is protected-merged through PR #150 at `{MERGE}` from exact final head `{HEAD}` after CI #435 / run `{RUN}` completed 10/10 SUCCESS.",
              "README Stage 3.74 evidence",
          )
          write(path, text)

          path = "docs/SOURCE_OF_TRUTH.md"
          text = read(path)
          text = sub_required(
              text,
              r"^\*\*Documentation registry baseline:.*$",
              f"**Documentation registry baseline: Stage 3.74 is canonical on protected `develop` through PR #150 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #435 / run `{RUN}` completed 10/10 SUCCESS; active registries are synchronized by the Stage 3.74 post-merge documentation closure.**",
              "SOT registry baseline",
          )
          text = sub_required(
              text,
              r"^\*\*Implementation frontier:.*$",
              f"**Implementation frontier: Stage 3.74 — Transaction Correction & Reversal / Ledger Repair UX is COMPLETE / CANONICAL through PR #150 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #435 / run `{RUN}` completed 10/10 SUCCESS. Stage 3.74 is the last completed implementation stage; any Stage 3.75+ runtime or architecture-changing scope requires a separately reviewed gate.**",
              "SOT implementation frontier",
          )
          text = sub_required(
              text,
              r"^\*\*Current candidate frontier:.*$",
              "**Current candidate frontier: none. No Stage 3.75+ product/runtime scope is authorized by the Stage 3.74 merge or this documentation closure.**",
              "SOT candidate frontier",
          )
          write(path, text)

          path = "docs/ROADMAP.md"
          text = read(path)
          text = sub_required(
              text,
              r"^\| 3\.74 — Transaction Correction & Reversal / Ledger Repair UX \|.*$",
              f"| 3.74 — Transaction Correction & Reversal / Ledger Repair UX | Wire the frozen correction/reversal commands, preserve append-only auditability, materialize deterministic effective ledger truth, reject historical oversell and expose Edit/Reverse UX | Complete / canonical through PR #150 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #435 / run `{RUN}` 10/10 SUCCESS; no new migration, market provider or paid infrastructure; post-merge lifecycle/documentation synchronized |",
              "ROADMAP Stage 3.74 row",
          )
          write(path, text)

          path = "docs/DOCUMENT_INDEX.md"
          text = read(path)
          text = sub_required(
              text,
              r"^\| Stage 3\.74 Transaction Correction & Reversal / Ledger Repair UX \|.*$",
              f"| Stage 3.74 Transaction Correction & Reversal / Ledger Repair UX | Complete/canonical through PR #150 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #435 / run `{RUN}` 10/10 SUCCESS; append-only revisions/reversals, effective-ledger materialization, oversell rollback, exact replay, retry-safe Edit/Reverse UX and HTTP contract witnesses | `stages/STAGE_03_74_TRANSACTION_CORRECTION_REVERSAL_IMPLEMENTATION.md` |",
              "DOCUMENT_INDEX Stage 3.74 row",
          )
          write(path, text)

          path = "docs/IMPLEMENTATION_LOG.md"
          text = read(path)
          text = sub_required(
              text,
              r"^\| 3 — First Vertical Slice \|.*$",
              "| 3 — First Vertical Slice | Deliver the staged MVP vertical slice and harden it through audit remediation and product feature increments | Complete through Stage 3.74 on protected `develop`; original repository audit 32/32 CLOSED; Stage 3.25 privacy evidence collection remains separate | [Roadmap](ROADMAP.md) |",
              "IMPLEMENTATION_LOG Stage 3 summary",
          )
          text = sub_required(
              text,
              r"^\| 3\.74 — Transaction Correction & Reversal / Ledger Repair UX \|.*$",
              f"| 3.74 — Transaction Correction & Reversal / Ledger Repair UX | Implement immutable correction/reversal commands, effective-ledger truth, historical oversell rejection, exact replay and user-visible Edit/Reverse controls | Complete / canonical through PR #150 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #435 / run `{RUN}` 10/10 SUCCESS; lifecycle/documentation synchronized post-merge | [Stage 3.74 report](stages/STAGE_03_74_TRANSACTION_CORRECTION_REVERSAL_IMPLEMENTATION.md) |",
              "IMPLEMENTATION_LOG Stage 3.74 row",
          )
          write(path, text)

          path = "docs/stages/STAGE_03_74_TRANSACTION_CORRECTION_REVERSAL_IMPLEMENTATION.md"
          text = read(path)
          text = sub_required(
              text,
              r"^\| Status \| IMPLEMENTATION CANDIDATE — canonical only after reviewed protected merge \|$",
              "| Status | COMPLETE / CANONICAL |",
              "Stage dossier status",
          )
          if "| Implementation PR | #150 |" not in text:
              anchor = "| Canonical base | `develop@18fff1150ac8d1d3c4eafbf7065d38d0bbb47f55` |"
              if anchor not in text:
                  raise SystemExit("missing Stage dossier canonical base anchor")
              text = text.replace(anchor, anchor + f"\n| Implementation PR | #150 |\n| Final reviewed head | `{HEAD}` |\n| Exact-head CI | #435 / run `{RUN}` — 10/10 SUCCESS |\n| Protected squash merge | `{MERGE}` |", 1)
          if "## Post-merge lifecycle closure" not in text:
              text += f"\n\n## Post-merge lifecycle closure\n\nStage 3.74 passed final implementation review and exact-head CI #435 / run `{RUN}` with all 10 required jobs SUCCESS on `{HEAD}`. After explicit human authorization, PR #150 was squash-merged into protected `develop` at `{MERGE}`. The merge preserves the immutable financial-ledger model: correction appends revisions, reversal appends a separate immutable reversal row, Stage 3.71 remains the sole WAC/acquisition-basis engine, and Stage 3.72/3.73 consume deterministic effective-ledger truth.\n\nThe final review also records the defects closed before merge: corrected-command responses expose `CORRECTED`, snapshot overflow preserves canonical `ErrInvalidInput`, replay witnesses use valid request/trace metadata, frontend assertions are robust, browser retries preserve principal-scoped idempotency identity, and dedicated HTTP witnesses cover PATCH/DELETE routing, DTOs, stale-revision 409 mapping and required nested settlement-date semantics.\n\nThis post-merge closure changes no runtime behavior, database schema, provider activation, production deployment, paid infrastructure or later-stage authorization. Stage 3.74 is COMPLETE / CANONICAL; the next product/runtime gate is Stage 3.75+.\n"
          write(path, text)

          path = "docs/CHANGELOG.md"
          text = read(path)
          marker = "## 2026-09-07 — Stage 3.74 transaction correction/reversal canonical and documentation synchronized"
          if marker not in text:
              insert_at = text.find("\n## ")
              if insert_at < 0:
                  raise SystemExit("CHANGELOG has no section anchor")
              block = f"\n\n{marker}\n\n- PR #150 was squash-merged into protected `develop` at `{MERGE}` from exact final head `{HEAD}`.\n- CI #435 / run `{RUN}` completed all 10 required jobs successfully before protected merge.\n- Stage 3.74 makes correction/reversal append-only and auditable, projects deterministic effective-ledger truth into positions/Time Machine, rejects historical oversell atomically, and exposes retry-safe Edit/Reverse UX.\n- No database migration, market provider activation, paid infrastructure or production rollout was introduced.\n- Post-merge documentation synchronization advances the next runtime gate to Stage 3.75+.\n"
              text = text[:insert_at] + block + text[insert_at:]
          write(path, text)

          path = "docs/VERSION_MATRIX.md"
          text = read(path)
          marker = "Stage 3.74 Transaction Correction & Reversal / Ledger Repair UX"
          if marker not in text:
              block = f"\n\nStage 3.74 current implementation authority\n\n| Scope | Authority | Evidence |\n| --- | --- | --- |\n| {marker} | COMPLETE / CANONICAL | PR #150; final head `{HEAD}`; CI #435 / run `{RUN}` 10/10 SUCCESS; protected squash merge `{MERGE}` |\n"
              text = text.rstrip() + block + "\n"
          write(path, text)

          path = "docs/OPEN_QUESTIONS.md"
          text = read(path)
          text = text.replace("Stage 3.73 is the last documentation-closed implementation stage", "Stage 3.74 is the last documentation-closed implementation stage")
          write(path, text)

          path = "docs/governance/REPOSITORY_DOCUMENTATION_RECONCILIATION.md"
          text = read(path)
          old = "This reconciliation remains the historical canonical synchronization baseline through Stage 3.72. Stage 3.73 subsequently became COMPLETE / CANONICAL through PR #148 squash merge `683f9c4647f888bb3dbdfb9dd365b84b95137b46` after exact-head CI #424; no Stage 3.74 work is implied by this historical reconciliation or by the Stage 3.73 closure. Any new product/runtime stage must be separately planned and reviewed."
          new = f"This reconciliation remains the historical canonical synchronization baseline through Stage 3.72. Stage 3.73 subsequently became COMPLETE / CANONICAL through PR #148, and Stage 3.74 subsequently became COMPLETE / CANONICAL through PR #150 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #435 / run `{RUN}` 10/10 SUCCESS. Neither historical reconciliation grants later runtime scope; any Stage 3.75+ product/runtime stage must be separately planned and reviewed."
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("missing governance reconciliation next-gate anchor")
          write(path, text)

          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          allowed = {"README.md"}
          allowed.update(p for p in changed if p.startswith("docs/"))
          bad = [p for p in changed if p not in allowed and p != ".github/workflows/stage374-docs-closure.yml"]
          if bad:
              raise SystemExit(f"unexpected non-doc changes: {bad}")
          PY
      - name: Remove temporary workflow and commit docs-only closure
        run: |
          git rm .github/workflows/stage374-docs-closure.yml
          git add README.md docs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: close Stage 3.74 lifecycle"
          git push origin HEAD:docs/stage-03-74-runtime-closure
