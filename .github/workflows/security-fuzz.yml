name: Security Fuzz

on:
  pull_request:
    paths:
      - "backend-go/**"
      - ".github/workflows/security-fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-go
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/decimal
            target: FuzzFromString
          - package: ./internal/importer
            target: FuzzReviewCSV
          - package: ./internal/httpapi
            target: FuzzLosslessPasswordJSON
          - package: ./internal/httpapi
            target: FuzzPaginationCursorRoundTrip
          - package: ./internal/verticalslice
            target: FuzzParseBusinessDate
          - package: ./internal/verticalslice
            target: FuzzXIRRTwoFlowProjection

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Fuzz ${{ matrix.target }}
        run: go test ${{ matrix.package }} -run=^$ -fuzz=^${{ matrix.target }}$ -fuzztime=30s
