name: Stage 3.73 documentation synchronization

on:
  push:
    branches:
      - feat/stage-03-73-portfolio-time-machine

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/stage-03-73-portfolio-time-machine
          fetch-depth: 0
      - name: Synchronize Stage 3.73 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "README.md",
              "Stage 3 is now implemented through **Stage 3.72 — Portfolio Position Projection / Cost Basis View**.",
              "Stage 3 is now implemented through **Stage 3.73 — Portfolio Time Machine / Historical Position View**.",
          )
          replace_once(
              "README.md",
              "and the dedicated portfolio positions API/UI.",
              "the dedicated portfolio positions API/UI, and historical position reconstruction by explicit BusinessDate through the existing Stage 3.72 as-of contract.",
          )
          replace_once(
              "README.md",
              "Stage 3.68 Dividend Calculator and Stages 3.71–3.72 portfolio position/cost-basis views are canonical.",
              "Stage 3.68 Dividend Calculator and Stages 3.71–3.73 portfolio position/cost-basis and Time Machine views are canonical once the Stage 3.73 implementation is protected-merged.",
          )

          replace_once("docs/ROADMAP.md", "| Version | 1.1.92 |", "| Version | 1.1.93 |")
          replace_once(
              "docs/ROADMAP.md",
              "| Next Review Date | Before any later Portfolio Position / Cost Basis scope, Stage 3.25 evidence-collection plan review, evidence collection, formal Security Review, ADR-008 acceptance, provider proposal, Feature 3D corporate-actions source/use planning, privacy-lifecycle migration proposal, or the next separately reviewed audit-remediation scope |",
              "| Next Review Date | Before any Stage 3.74+ Portfolio Position / Cost Basis scope, Stage 3.25 evidence-collection plan review, evidence collection, formal Security Review, ADR-008 acceptance, provider proposal, Feature 3D corporate-actions source/use planning, privacy-lifecycle migration proposal, or the next separately reviewed audit-remediation scope |",
          )
          old_372_roadmap = "| 3.72 — Portfolio Position Projection lifecycle/documentation closure | Synchronize active canonical documentation with the already-merged Stage 3.72 runtime; record purpose, implementation, expected behavior, verification, preserved boundaries and residual scope without runtime change | Merge-activated closure record; canonical only after protected merge of this documentation synchronization |"
          new_372_roadmap = "| 3.72 — Portfolio Position Projection lifecycle/documentation closure | Synchronize active canonical documentation with the already-merged Stage 3.72 runtime; record purpose, implementation, expected behavior, verification, preserved boundaries and residual scope without runtime change | Complete / PR #146 squash-merged into protected `develop` at `ac0396eff47ce5cd862f41a5ec8ab2803de7fa58`; Stage 3.72 lifecycle/documentation closure COMPLETE |"
          row_373_roadmap = "| 3.73 — Portfolio Time Machine / Historical Position View | Turn the existing Stage 3.72 endpoint-local `asOfDate` semantics into user-visible Current ↔ Historical position navigation without a second financial engine, new endpoint, table, cache or provider | Merge-activated implementation; canonical only when `STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md` and its runtime/test changes are present on protected `develop` |"
          replace_once("docs/ROADMAP.md", old_372_roadmap, new_372_roadmap + "\n" + row_373_roadmap)

          replace_once("docs/SOURCE_OF_TRUTH.md", "| Version | 1.4.95 |", "| Version | 1.4.96 |")
          replace_once(
              "docs/SOURCE_OF_TRUTH.md",
              "| Next Review Date | Before any later Portfolio Position / Cost Basis scope, Stage 3.25 privacy evidence-collection plan review, Feature 3D corporate-actions source/use planning, or the next separately reviewed audit-remediation scope |",
              "| Next Review Date | Before any Stage 3.74+ Portfolio Position / Cost Basis scope, Stage 3.25 privacy evidence-collection plan review, Feature 3D corporate-actions source/use planning, or the next separately reviewed audit-remediation scope |",
          )
          replace_once(
              "docs/SOURCE_OF_TRUTH.md",
              "**Documentation registry baseline: synchronized through Stage 3.72; README, Implementation Log, Changelog, Version Matrix, Open Questions, Document Index and the repository-audit register describe the same canonical product/audit state on protected `develop`.**\n**Last completed implementation stage: Stage 3.72 — Portfolio Position Projection / Cost Basis View / PR #145 squash merge `e935f19b68624f0b8be6ca293ead8f4395cf555e` / protected tree `3775b533867c2fb6de473da84a105cf3367cf848` / CI #413 run `34091588982` 10/10 SUCCESS**",
              "**Documentation registry baseline: Stage 3.72 is the protected baseline before this Stage 3.73 candidate; once this Stage 3.73 implementation record is present on protected `develop`, README, Implementation Log, Roadmap, Document Index and Source of Truth are synchronized through Stage 3.73.**\n**Implementation frontier: Stage 3.73 — Portfolio Time Machine / Historical Position View is merge-activated in this implementation record. Before protected activation, Stage 3.72 / PR #145 squash merge `e935f19b68624f0b8be6ca293ead8f4395cf555e` remains the last completed implementation stage; once this Stage 3.73 implementation is present on protected `develop`, Stage 3.73 is the last completed implementation stage.**",
          )
          replace_once(
              "docs/SOURCE_OF_TRUTH.md",
              "No market provider activation, production rollout, XIRR/returns, imported SELL expansion, correction/reversal runtime, tax basis, bond NKD, notifications, AI, Redis/workers or later-stage scope is authorized by Stage 3.72.**",
              "No market provider activation, production rollout, XIRR/returns, imported SELL expansion, correction/reversal runtime, tax basis, bond NKD, notifications, AI, Redis/workers or later-stage scope is authorized by Stage 3.72. Stage 3.73 reuses the same endpoint-local `asOfDate` projection for user-visible historical holdings, adds no financial engine/API/schema/provider, and keeps all market-derived fields unavailable.**",
          )

          replace_once("docs/DOCUMENT_INDEX.md", "| Version | 1.1.71 |", "| Version | 1.1.72 |")
          replace_once(
              "docs/DOCUMENT_INDEX.md",
              "| Next Review Date | Before any later Portfolio Position / Cost Basis scope, Stage 3.25 evidence-collection plan review, evidence collection, formal Security Review, ADR-008 acceptance, provider proposal, Feature 3D corporate-actions source/use planning, privacy-lifecycle migration proposal, or the next separately reviewed audit-remediation scope |",
              "| Next Review Date | Before any Stage 3.74+ Portfolio Position / Cost Basis scope, Stage 3.25 evidence-collection plan review, evidence collection, formal Security Review, ADR-008 acceptance, provider proposal, Feature 3D corporate-actions source/use planning, privacy-lifecycle migration proposal, or the next separately reviewed audit-remediation scope |",
          )
          old_372_index = "| Stage 3.72 lifecycle/documentation closure | Records purpose, implemented behavior, expected user-visible outcome, verification, preserved architecture boundaries and residual non-Stage-3.72 scope; merge-activated and canonical only after protected merge of this documentation synchronization | `stages/STAGE_03_72_PORTFOLIO_POSITION_PROJECTION_IMPLEMENTATION_CLOSURE.md` |"
          new_372_index = "| Stage 3.72 lifecycle/documentation closure | Complete/canonical through PR #146 squash merge `ac0396eff47ce5cd862f41a5ec8ab2803de7fa58`; records purpose, implementation, expected behavior, verification and preserved boundaries | `stages/STAGE_03_72_PORTFOLIO_POSITION_PROJECTION_IMPLEMENTATION_CLOSURE.md` |"
          row_373_index = "| Stage 3.73 Portfolio Time Machine / Historical Position View | Merge-activated implementation over the existing Stage 3.72 `asOfDate` positions contract; Current ↔ Historical UI, stale-result protection and historical financial witnesses; no new endpoint/schema/provider | `stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md` |"
          replace_once("docs/DOCUMENT_INDEX.md", old_372_index, new_372_index + "\n" + row_373_index)
          replace_once(
              "docs/DOCUMENT_INDEX.md",
              "This documentation closure becomes canonical only after its protected merge;",
              "Stage 3.72 lifecycle/documentation closure is canonical through PR #146 squash merge `ac0396eff47ce5cd862f41a5ec8ab2803de7fa58`;",
          )

          replace_once("docs/IMPLEMENTATION_LOG.md", "| Version | 1.2.0 |", "| Version | 1.2.1 |")
          replace_once(
              "docs/IMPLEMENTATION_LOG.md",
              "| Next Review Date | Before any Stage 3.73+ runtime scope, provider/public activation, privacy-lifecycle implementation, tax-basis expansion, imported SELL expansion, or other architecture-changing work |",
              "| Next Review Date | Before any Stage 3.74+ runtime scope, provider/public activation, privacy-lifecycle implementation, tax-basis expansion, imported SELL expansion, or other architecture-changing work |",
          )
          row_372_log = "| 3.72 — Portfolio Position Projection / Cost Basis View | Expose canonical open STOCK/BOND positions, acquisition-basis allocation and explicit market-unavailable semantics through API/UI | Complete / runtime and lifecycle canonical through PRs #145/#146 | [Stage 3.72 closure](stages/STAGE_03_72_PORTFOLIO_POSITION_PROJECTION_IMPLEMENTATION_CLOSURE.md) |"
          row_373_log = "| 3.73 — Portfolio Time Machine / Historical Position View | Expose exact historical holdings by BusinessDate using the existing Stage 3.72 `asOfDate` projection and canonical Stage 3.71 position engine | Merge-activated implementation; no new API, schema, provider or financial algorithm | [Stage 3.73 report](stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md) |"
          replace_once("docs/IMPLEMENTATION_LOG.md", row_372_log, row_372_log + "\n" + row_373_log)
          replace_once(
              "docs/IMPLEMENTATION_LOG.md",
              "Current baseline complete through Stage 3.72; original repository audit 32/32 CLOSED;",
              "Stage 3.72 is the protected baseline before the Stage 3.73 candidate; once Stage 3.73 is present on protected `develop`, current baseline is complete through Stage 3.73; original repository audit 32/32 CLOSED;",
          )
          PY
      - name: Remove one-shot workflow from final diff
        run: rm .github/workflows/stage-03-73-docs-sync.yml
      - name: Verify scope and commit
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(README\.md|docs/)'; then
            echo 'Unexpected non-documentation path changed by docs sync' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: synchronize Stage 3.73 implementation state'
          git push origin HEAD:feat/stage-03-73-portfolio-time-machine
