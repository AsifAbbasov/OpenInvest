name: Resilience Chaos Audit 24h

on:
  push:
    branches:
      - chore/native-go-fuzz-targets
    paths:
      - ".github/workflows/adversarial-audit-24h.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resilience-chaos-24h-${{ github.ref }}
  cancel-in-progress: false

jobs:
  multi-instance-clock-soak:
    name: "Chaos 1 - Multi-instance, idempotency and clock-skew soak"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: chaos-audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        working-directory: .
        run: |
          set -euo pipefail
          for migration in infrastructure/postgres/migrations/*.up.sql; do
            psql "postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable" -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Five-hour multi-instance and clock-skew soak
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -euo pipefail
          end=$((SECONDS + 18000))
          iteration=0
          while (( SECONDS < end )); do
            iteration=$((iteration + 1))
            echo "CHAOS_MULTI_INSTANCE_ITERATION=$iteration"
            go test -race ./internal/postgres               -run='^TestChaos(MultiInstanceSharedDatabaseSerializesMutations|MultiInstanceSharedIdempotencyAllowsOneMutation|ClockSkewDoesNotOverrideLedgerSequenceAuthority)$'               -count=5
          done

  network-partition-process-kill:
    name: "Chaos 2 - Network partition and process-kill transaction recovery"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: chaos-audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Prepare disposable transaction witness
        run: |
          set -euo pipefail
          psql "postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.chaos_commit_witness (
            id BIGSERIAL PRIMARY KEY,
            marker TEXT NOT NULL UNIQUE
          );
          SQL
      - name: Repeated process termination before COMMIT
        run: |
          set -euo pipefail
          url="postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable"
          end=$((SECONDS + 7200))
          i=0
          while (( SECONDS < end )); do
            i=$((i + 1))
            marker="killed-client-$i"
            (
              psql "$url" -v ON_ERROR_STOP=1 <<SQL
          BEGIN;
          INSERT INTO public.chaos_commit_witness(marker) VALUES ('$marker');
          SELECT pg_sleep(30);
          COMMIT;
          SQL
            ) &
            client=$!
            sleep 0.25
            kill -9 "$client" 2>/dev/null || true
            wait "$client" 2>/dev/null || true
            for n in {1..50}; do
              count="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.chaos_commit_witness WHERE marker='$marker';")" && break
              sleep 0.1
            done
            test "${count:-1}" = "0"
          done
      - name: Repeated database network partitions and recovery
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          url="postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable"
          end=$((SECONDS + 10800))
          i=0
          while (( SECONDS < end )); do
            i=$((i + 1))
            echo "NETWORK_PARTITION_ITERATION=$i"
            docker network disconnect bridge "$DB_CONTAINER" || true
            sleep 2
            if psql "$url" -At -c 'SELECT 1' >/dev/null 2>&1; then
              echo "partition did not interrupt connectivity" >&2
              exit 1
            fi
            docker network connect bridge "$DB_CONTAINER" || true
            for n in {1..60}; do
              if psql "$url" -At -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            test "$(psql "$url" -At -v ON_ERROR_STOP=1 -c 'SELECT 1')" = "1"
            sleep 1
          done

  disk-pressure-recovery:
    name: "Chaos 3 - Isolated PostgreSQL disk exhaustion and recovery"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Five-hour isolated disk-pressure cycles
        run: |
          set -euo pipefail
          end=$((SECONDS + 18000))
          cycle=0
          while (( SECONDS < end )); do
            cycle=$((cycle + 1))
            name="oi-disk-chaos-$cycle"
            port=$((56000 + cycle % 500))
            docker run -d --rm --name "$name"               --tmpfs /var/lib/postgresql/data:rw,size=320m               -e POSTGRES_DB=openinvest               -e POSTGRES_USER=openinvest               -e POSTGRES_PASSWORD=chaos-disk               -p "127.0.0.1:$port:5432"               postgres:18 >/dev/null
            cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
            trap cleanup EXIT

            for n in {1..90}; do
              if docker exec "$name" pg_isready -U openinvest -d openinvest >/dev/null 2>&1; then break; fi
              sleep 1
            done
            docker exec "$name" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 -c               "CREATE TABLE pressure(id bigserial primary key, payload bytea not null);"

            available_kb="$(docker exec "$name" df -Pk /var/lib/postgresql/data | awk 'NR==2 {print $4}')"
            leave_kb=12288
            fill_kb=$((available_kb - leave_kb))
            if (( fill_kb > 0 )); then
              docker exec -u 0 "$name" sh -c "dd if=/dev/zero of=/var/lib/postgresql/data/chaos.fill bs=1024 count=$fill_kb status=none" || true
            fi

            if docker exec "$name" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 -c               "INSERT INTO pressure(payload) SELECT repeat('x', 1024)::bytea FROM generate_series(1,50000);" >/tmp/disk-write.log 2>&1; then
              echo "disk-pressure write unexpectedly completed; pressure was insufficient" >&2
              cat /tmp/disk-write.log >&2
              exit 1
            fi

            docker exec -u 0 "$name" rm -f /var/lib/postgresql/data/chaos.fill
            for n in {1..60}; do
              if docker exec "$name" pg_isready -U openinvest -d openinvest >/dev/null 2>&1; then break; fi
              sleep 1
            done
            docker exec "$name" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 <<'SQL'
            CHECKPOINT;
            SELECT 1;
            INSERT INTO pressure(payload) VALUES ('recovered'::bytea);
            SELECT count(*) >= 1 FROM pressure;
            SQL
            cleanup
            trap - EXIT
          done

  replica-lag-recovery:
    name: "Chaos 4 - Logical replica lag, pause and catch-up"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Start isolated logical primary and replica
        run: |
          set -euo pipefail
          docker network create oi-replica-chaos
          docker run -d --rm --name oi-chaos-primary --network oi-replica-chaos             -e POSTGRES_DB=openinvest -e POSTGRES_USER=openinvest -e POSTGRES_PASSWORD=replica-chaos             postgres:18 -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
          docker run -d --rm --name oi-chaos-replica --network oi-replica-chaos             -e POSTGRES_DB=openinvest -e POSTGRES_USER=openinvest -e POSTGRES_PASSWORD=replica-chaos             postgres:18
          for c in oi-chaos-primary oi-chaos-replica; do
            for n in {1..90}; do
              if docker exec "$c" pg_isready -U openinvest -d openinvest >/dev/null 2>&1; then break; fi
              sleep 1
            done
          done
          docker exec oi-chaos-primary psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE replicated_witness(id bigint PRIMARY KEY, payload text NOT NULL);
          CREATE PUBLICATION chaos_pub FOR TABLE replicated_witness;
          SQL
          docker exec oi-chaos-replica psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE replicated_witness(id bigint PRIMARY KEY, payload text NOT NULL);
          CREATE SUBSCRIPTION chaos_sub
            CONNECTION 'host=oi-chaos-primary dbname=openinvest user=openinvest password=replica-chaos'
            PUBLICATION chaos_pub;
          SQL
      - name: Five-hour replica-lag and catch-up cycles
        run: |
          set -euo pipefail
          end=$((SECONDS + 18000))
          cycle=0
          id=0
          while (( SECONDS < end )); do
            cycle=$((cycle + 1))
            docker pause oi-chaos-replica >/dev/null
            for n in {1..200}; do
              id=$((id + 1))
              docker exec oi-chaos-primary psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 -c                 "INSERT INTO replicated_witness VALUES ($id, 'cycle-$cycle');" >/dev/null
            done
            primary_count="$(docker exec oi-chaos-primary psql -U openinvest -d openinvest -At -c 'SELECT count(*) FROM replicated_witness;')"
            docker unpause oi-chaos-replica >/dev/null
            caught=0
            for n in {1..120}; do
              replica_count="$(docker exec oi-chaos-replica psql -U openinvest -d openinvest -At -c 'SELECT count(*) FROM replicated_witness;' 2>/dev/null || echo -1)"
              if [[ "$replica_count" == "$primary_count" ]]; then caught=1; break; fi
              sleep 1
            done
            test "$caught" -eq 1
            sleep 30
          done
      - name: Cleanup replica chaos containers
        if: always()
        run: |
          docker rm -f oi-chaos-primary oi-chaos-replica >/dev/null 2>&1 || true
          docker network rm oi-replica-chaos >/dev/null 2>&1 || true

  migration-interruption-recovery:
    name: "Chaos 5 - Exact concurrent-index interruption and recovery"
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: chaos-audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations through pre-index state
        working-directory: .
        run: |
          set -euo pipefail
          for migration in infrastructure/postgres/migrations/*.up.sql; do
            case "$migration" in
              *000009_stage_03_71_ledger_sequence_unique.up.sql) break ;;
            esac
            psql "postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable" -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Seed large pre-activation ledger
        working-directory: .
        run: |
          set -euo pipefail
          url="postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable"
          psql "$url" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO investment.subjects(id)
          VALUES ('20000000-0000-4000-8000-000000000001')
          ON CONFLICT DO NOTHING;
          INSERT INTO investment.portfolios(id, subject_id, name)
          VALUES ('20000000-0000-4000-8000-000000000002','20000000-0000-4000-8000-000000000001','chaos migration')
          ON CONFLICT DO NOTHING;
          INSERT INTO investment.transaction_entries(
            entry_id, transaction_id, portfolio_id, revision, transaction_type,
            gross_amount, trade_date, source_kind, created_at
          )
          SELECT
            gen_random_uuid(), gen_random_uuid(),
            '20000000-0000-4000-8000-000000000002'::uuid,
            1, 'DEPOSIT', 0, '2026-01-01'::date, 'MANUAL', now()
          FROM generate_series(1, 400000);
          SQL
      - name: Five-hour exact DDL interruption and owner recovery loop
        env:
          OPENINVEST_DATABASE_OWNER_URL: postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -euo pipefail
          url="$OPENINVEST_DATABASE_OWNER_URL"
          end=$((SECONDS + 18000))
          cycle=0
          while (( SECONDS < end )); do
            cycle=$((cycle + 1))
            psql "$url" -v ON_ERROR_STOP=1 -c               'DROP INDEX CONCURRENTLY IF EXISTS investment.transaction_entries_portfolio_ledger_sequence_uidx;' >/dev/null

            (
              psql "$url" -v ON_ERROR_STOP=1 -c                 'CREATE UNIQUE INDEX CONCURRENTLY transaction_entries_portfolio_ledger_sequence_uidx ON investment.transaction_entries (portfolio_id, ledger_sequence);'
            ) &
            ddl_client=$!

            pid=""
            for n in {1..200}; do
              pid="$(psql "$url" -At -c "SELECT pid FROM pg_stat_progress_create_index WHERE index_relid::regclass::text LIKE '%transaction_entries_portfolio_ledger_sequence_uidx%' LIMIT 1;" 2>/dev/null || true)"
              [[ -n "$pid" ]] && break
              sleep 0.05
            done
            if [[ -n "$pid" ]]; then
              psql "$url" -v ON_ERROR_STOP=1 -c "SELECT pg_terminate_backend($pid);" >/dev/null || true
            else
              kill -9 "$ddl_client" 2>/dev/null || true
            fi
            wait "$ddl_client" 2>/dev/null || true

            go run ./cmd/recover-ledger-sequence-index

            state="$(psql "$url" -At -v ON_ERROR_STOP=1 -c "
              SELECT i.indisvalid::text || '|' || i.indisready::text
              FROM pg_class c
              JOIN pg_namespace n ON n.oid=c.relnamespace
              JOIN pg_index i ON i.indexrelid=c.oid
              WHERE n.nspname='investment'
                AND c.relname='transaction_entries_portfolio_ledger_sequence_uidx';")"
            test "$state" = "true|true"
          done


  combined-contention-soak:
    name: "Chaos 6 - Combined same-database contention soak"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: chaos-audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        working-directory: .
        run: |
          set -euo pipefail
          for migration in infrastructure/postgres/migrations/*.up.sql; do
            psql "postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable" -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Five-hour combined contention load
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -euo pipefail
          end=$((SECONDS + 18000))
          workers=8
          pids=()

          worker() {
            id="$1"
            while (( SECONDS < end )); do
              echo "COMBINED_WORKER=$id SECONDS=$SECONDS"
              case $((id % 4)) in
                0)
                  go test -race ./internal/postgres                     -run='^TestChaos(MultiInstanceSharedDatabaseSerializesMutations|MultiInstanceSharedIdempotencyAllowsOneMutation|ClockSkewDoesNotOverrideLedgerSequenceAuthority)$'                     -count=2
                  ;;
                1)
                  go test -race ./internal/postgres                     -run='^(TestAuthorizationMatrix|TestSecurityAuthorizationMatrix)'                     -count=2
                  ;;
                2)
                  go test -race ./internal/postgres                     -run='^TestResourceExhaustionPostgresPoolSaturationCancelsAndRecovers$'                     -count=2
                  ;;
                3)
                  go test -race ./internal/postgres                     -run='^(TestStage371Concurrent|TestStage374Concurrent)'                     -count=2
                  ;;
              esac
            done
          }

          for id in $(seq 1 "$workers"); do
            worker "$id" >"combined-worker-$id.log" 2>&1 &
            pids+=("$!")
          done

          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done

          for log in combined-worker-*.log; do
            echo "===== $log ====="
            tail -n 200 "$log" || true
          done

          test "$failed" -eq 0
      - name: Verify database remains usable after combined pressure
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:chaos-audit@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -euo pipefail
          go test ./internal/postgres             -run='^(TestAuthorizationMatrixRejectsCrossSubjectPortfolioAccess|TestStage371ConcurrentSellSerializesAndCommitsOnlyLegalQuantity)$'             -count=5 -v
