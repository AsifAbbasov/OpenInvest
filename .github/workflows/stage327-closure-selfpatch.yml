name: Stage 3.27 closure sync

on:
  pull_request:
    types: [opened]
    branches: [develop]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'docs/stage-03-27-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: docs/stage-03-27-closure
          fetch-depth: 0
      - name: Record Stage 3.27 canonical closure
        shell: python
        run: |
          from pathlib import Path
          import re

          MERGE_SHA = '6e8c806de857f844954f1db513487357dfe90187'
          REVIEW_HEAD = 'b281d5bdc1c28ca4f4ac6d913ca9683859209e4c'

          def rw(path):
              p = Path(path)
              return p, p.read_text()

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              return text.replace(old, new, 1)

          def line(text, pattern, replacement, label):
              out, n = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 line, found {n}')
              return out

          p, t = rw('docs/SOURCE_OF_TRUTH.md')
          t = once(t, '| Version | 1.4.56 |', '| Version | 1.4.57 |', 'SOT version')
          t = line(t, r'^\*\*Current remediation delivery item: Stage 3\.27.*$', f'**Last completed audit remediation: Stage 3.27 Import Financial Identity and Cash-Flow Semantics Remediation; implementation PR #55 passed exact-head CI #90 and renewed independent review `APPROVED` at `{REVIEW_HEAD}`, received explicit human squash-merge approval, and was squash-merged into `develop` at `{MERGE_SHA}`; Stage 3.27 is canonical and closed; remaining audit findings P1-01 and P1-05 are separate future work**', 'SOT remediation status')
          marker = '\n## Financial standard\n'
          closure = f'''\n### Stage 3.27 closure\n\nStage 3.27 closed after implementation PR #55 passed exact-head CI #90 and renewed independent review `APPROVED` at `{REVIEW_HEAD}`, received explicit human squash-merge authorization, and was squash-merged into `develop` at `{MERGE_SHA}`. The earlier independent `REQUEST CHANGES` on pre-correction head `c6c3a4c91a108426448a2bc230873ab9e479a335` remains historical evidence of the fallback-to-strong identity defect that was corrected before approval. Stage 3.25 privacy evidence planning remains separate and unchanged.\n'''
          t = once(t, marker, closure + marker, 'SOT closure insert')
          p.write_text(t)

          p, t = rw('docs/IMPLEMENTATION_LOG.md')
          t = once(t, '| Version | 1.1.50 |', '| Version | 1.1.51 |', 'implementation version')
          t = line(t, r'^\| 3 — First Vertical Slice \|.*$', '| 3 — First Vertical Slice | Implement the first thin MVP path after contract and Web baseline approval | Implementation closed through Stage 3.16 audit-fix closure; Stage 3.17-3.24 proposals are merged; Stage 3.25 privacy evidence planning remains separate; Stage 3.27 audit remediation is complete / closed and merged | [Stage 3 plan](stages/STAGE_03_FIRST_VERTICAL_SLICE.md) |', 'implementation stage 3')
          t = line(t, r'^\| 3\.27 — Import Financial Identity and Cash-Flow Semantics Remediation \|.*$', f'| 3.27 — Import Financial Identity and Cash-Flow Semantics Remediation | Remediate repository-audit P1-02/P1-03/P1-04 across import identity, reconciliation, cash-flow semantics, PostgreSQL, and OpenAPI | Complete / closed; implementation PR #55 squash-merged into `develop` at `{MERGE_SHA}` after exact-head CI #90, renewed independent `APPROVED`, and explicit human merge approval | [Stage 3.27 report](stages/STAGE_03_27_IMPORT_FINANCIAL_IDENTITY_REMEDIATION.md) |', 'implementation stage 3.27')
          t += f'''\n\n## 2026-08-22 — Stage 3.27 closed\n\n- PR #55 passed exact-head CI #90 on `{REVIEW_HEAD}`.\n- Renewed independent external review returned `APPROVED` on that exact merge-candidate head after the earlier fallback-to-strong identity blocker had been corrected.\n- Explicit human authorization approved squash merge of PR #55 into `develop`.\n- PR #55 was squash-merged into `develop` at `{MERGE_SHA}`.\n- Stage 3.27 is complete / closed. P1-01 refresh-token family replay and P1-05 Argon2 resource-exhaustion remain separate future audit-remediation work.\n- Stage 3.25 privacy Security Review evidence planning remains separate and is not superseded.\n'''
          p.write_text(t)

          p, t = rw('docs/CHANGELOG.md')
          t = once(t, '| Version | 1.1.53 |', '| Version | 1.1.54 |', 'changelog version')
          t += f'''\n\n## 2026-08-22 — Stage 3.27 closure\n\n- Recorded renewed independent review `APPROVED` on exact head `{REVIEW_HEAD}` after correction of the order-dependent fallback/strong import-identity defect.\n- Recorded exact-head GitHub Actions CI #90 success and explicit human squash-merge authorization.\n- Recorded PR #55 squash merge into `develop` at `{MERGE_SHA}`.\n- Closed Stage 3.27 for audit findings P1-02, P1-03, and P1-04 only; P1-01 and P1-05 remain separate future work.\n- Preserved Stage 3.25 privacy evidence planning as a separate proposal-only work item.\n'''
          p.write_text(t)

          p, t = rw('docs/DOCUMENT_INDEX.md')
          t = once(t, '| Version | 1.1.57 |', '| Version | 1.1.58 |', 'document index version')
          t = once(t, '| SOT-001 | Source of Truth | 1.4.56 | Approved | `SOURCE_OF_TRUTH.md` |', '| SOT-001 | Source of Truth | 1.4.57 | Approved | `SOURCE_OF_TRUTH.md` |', 'document index SOT version')
          t = line(t, r'^\| Stage 3\.27 import financial identity and cash-flow semantics remediation \|.*$', f'| Stage 3.27 import financial identity and cash-flow semantics remediation | Complete / closed; PR #55 squash-merged into `develop` at `{MERGE_SHA}` after exact-head CI #90, renewed independent `APPROVED`, and explicit human merge approval | `stages/STAGE_03_27_IMPORT_FINANCIAL_IDENTITY_REMEDIATION.md` |', 'document index stage 3.27')
          p.write_text(t)

          p, t = rw('docs/ROADMAP.md')
          t = once(t, '| Version | 1.1.55 |', '| Version | 1.1.56 |', 'roadmap version')
          t = line(t, r'^\| 3\.27 — Import financial identity and cash-flow semantics remediation \|.*$', f'| 3.27 — Import financial identity and cash-flow semantics remediation | Close audit P1-02/P1-03/P1-04 with persisted import identity, amount-aware cash reconciliation, and fail-closed cash-flow fee semantics | Complete / closed; PR #55 squash-merged into `develop` at `{MERGE_SHA}` |', 'roadmap stage 3.27')
          anchor = f'| 3.27 — Import financial identity and cash-flow semantics remediation | Close audit P1-02/P1-03/P1-04 with persisted import identity, amount-aware cash reconciliation, and fail-closed cash-flow fee semantics | Complete / closed; PR #55 squash-merged into `develop` at `{MERGE_SHA}` |\n'
          t = once(t, anchor, anchor + '| 3.27 — Closure governance | Record canonical merge, final review, CI, and human approval evidence | Complete / closure PR |\n', 'roadmap closure row')
          p.write_text(t)

          p, t = rw('docs/VERSION_MATRIX.md')
          t = once(t, '| Version | 1.1.61 |', '| Version | 1.1.62 |', 'version matrix version')
          t = line(t, r'^\| Stage 3\.27 import financial identity and cash-flow semantics remediation \|.*$', f'| Stage 3.27 import financial identity and cash-flow semantics remediation | 0.1.0 | Complete / closed; PR #55 squash-merged into `develop` at `{MERGE_SHA}` after exact-head CI #90, renewed independent `APPROVED`, and explicit human merge approval | 3 | Principal Architect | Closed 2026-08-22 |', 'version matrix stage 3.27')
          p.write_text(t)

          p, t = rw('docs/stages/STAGE_03_27_IMPORT_FINANCIAL_IDENTITY_REMEDIATION.md')
          t = line(t, r'^\| Status \|.*$', '| Status | Complete / closed; implementation PR #55 squash-merged into `develop` |', 'stage status')
          t = once(t, '| Branch | `fix/stage-03-27-import-financial-identity` |', f'| Branch | `fix/stage-03-27-import-financial-identity` |\n| Merge | PR #55; squash commit `{MERGE_SHA}` |\n| Final Review | `APPROVED` on `{REVIEW_HEAD}` after earlier `REQUEST CHANGES` was corrected |\n| Final CI | GitHub Actions #90 `SUCCESS` on `{REVIEW_HEAD}` |\n| Human Merge Authorization | Explicit user approval on 2026-08-22 |', 'stage merge metadata')
          residual = '\n## Residual risks and next work\n'
          closure_section = f'''\n## Closure evidence\n\n- Final merge-candidate head `{REVIEW_HEAD}` passed GitHub Actions CI #90 across frontend, PostgreSQL migration apply/rollback/reapply, Go tests, Docker Compose, Python, and OpenAPI gates.\n- Renewed independent external review returned `APPROVED` on that exact head.\n- The earlier `REQUEST CHANGES` on `c6c3a4c91a108426448a2bc230873ab9e479a335` remains preserved as historical evidence of the order-dependent fallback-to-strong identity defect; the approved head includes its correction and regression coverage.\n- Explicit human authorization approved squash merge of PR #55.\n- PR #55 was squash-merged into `develop` at `{MERGE_SHA}`.\n- This closure applies only to P1-02, P1-03, and P1-04. P1-01 and P1-05 remain unresolved separate audit-remediation items. Stage 3.25 remains separate proposal-only privacy evidence planning.\n'''
          t = once(t, residual, closure_section + residual, 'stage closure section')
          p.write_text(t)

          p, t = rw('README.md')
          if '6e8c806de857f844954f1db513487357dfe90187' not in t:
              t += f'''\n\n## Stage 3.27 audit remediation\n\nStage 3.27 is closed. PR #55 was squash-merged into `develop` at `{MERGE_SHA}` after exact-head CI #90, renewed independent review `APPROVED`, and explicit human merge authorization. The stage closes audit findings P1-02, P1-03, and P1-04 only; P1-01 and P1-05 remain separate future remediation work.\n'''
          p.write_text(t)

      - name: Remove one-time workflow and verify docs-only delta
        run: |
          git rm .github/workflows/stage327-closure-selfpatch.yml
          git diff --check
          git status --short
      - name: Commit clean closure tree
        run: |
          git config user.name "OpenInvest closure automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- README.md docs/CHANGELOG.md docs/DOCUMENT_INDEX.md docs/IMPLEMENTATION_LOG.md docs/ROADMAP.md docs/SOURCE_OF_TRUTH.md docs/VERSION_MATRIX.md docs/stages/STAGE_03_27_IMPORT_FINANCIAL_IDENTITY_REMEDIATION.md .github/workflows/stage327-closure-selfpatch.yml
          git diff --cached --check
          git commit -m "docs: close Stage 3.27 audit remediation"
          git push origin HEAD:docs/stage-03-27-closure