name: Module 1 final independent gap assault (bounded)
on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: module1-final-gaps-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  final-postgres-assault:
    name: 10k capacity + SQL fault injection + lease permutations + timing + ledger
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout pinned independent audit commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact commit and tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Go pinned
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations to disposable PostgreSQL 18
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Independent final gap matrix (collect every failure)
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set +e
          set -uo pipefail
          failures=0
          echo "::group::Verify test discovery"
          go test ./internal/postgres -list '^TestEmailOwnershipFinal' > /tmp/final-tests.txt
          discovery=$?
          cat /tmp/final-tests.txt
          if [ "$discovery" -ne 0 ]; then echo "TEST_HARNESS_COMPILE_FAILURE=$discovery"; exit "$discovery"; fi
          for expected in RegistrationSaturationAndRecovery MultiPointTransactionalFaultInjection IntentExpiryRejectsLateProof ReplacementLeaseAndStaleCallbacks ExhaustionConcurrentRecoveryAndLateCompletion RenewalWhilePriorLeaseUnfinished LegacyFinancialLedgerSurvivesVerificationAttack RandomizedEnumerationTimingAndBodyParity; do
            grep -q "^TestEmailOwnershipFinal$expected$" /tmp/final-tests.txt || { echo "TEST_DISCOVERY_MISSING=$expected"; exit 21; }
          done
          echo "::endgroup::"
          run_case() {
            name="$1"
            pattern="$2"
            echo "::group::$name"
            go test -race -v ./internal/postgres -run "^TestEmailOwnershipFinal$pattern$" -count=1 -timeout=3m
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then echo "CASE_FAILURE=$name RC=$rc"; failures=$((failures + 1)); else echo "CASE_PASS=$name"; fi
          }
          run_case capacity_10000 RegistrationSaturationAndRecovery
          run_case sql_faults_six_points MultiPointTransactionalFaultInjection
          run_case expired_intent_negative_control IntentExpiryRejectsLateProof
          run_case stale_callback_permutations ReplacementLeaseAndStaleCallbacks
          run_case concurrent_recovery_16 ExhaustionConcurrentRecoveryAndLateCompletion
          run_case old_generation_renewal RenewalWhilePriorLeaseUnfinished
          run_case legacy_financial_integrity LegacyFinancialLedgerSurvivesVerificationAttack
          run_case randomized_enumeration_timing RandomizedEnumerationTimingAndBodyParity
          echo "INDEPENDENT_FINAL_GAP_FAILURES=$failures"
          exit "$failures"
  final-mounted-frontend-assault:
    name: mounted stale-response + verification-principal switching
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout pinned independent audit commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact commit and tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - name: Install pinned frontend dependencies
        working-directory: frontend-next
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
      - name: Execute mounted component stale-response and hash-navigation cases
        working-directory: frontend-next
        run: |
          set -euo pipefail
          node --experimental-loader ./tests/css-module-loader.mjs --import tsx --test tests/module1-verification-stale-principal.redteam.test.tsx
