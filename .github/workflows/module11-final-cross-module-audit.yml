name: Module 11 Cross-Module Audit

on:
  push:
    branches:
      - audit/final-cross-module-security-v1
    paths:
      - "backend-go/**"
      - "frontend-next/**"
      - ".github/workflows/module11-final-cross-module-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-ownership-idempotency:
    name: A auth ownership idempotency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Run group A
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          go test -count=1 -v ./internal/postgres -run '^TestM11(ForeignSubjectReadMatrix|IdempotencyOwnershipReplayIsolation|AuthAccessTokenLifecycleMutationObservation)$'

  ledger-concurrency:
    name: B ledger import position XIRR concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Run group B
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          go test -count=1 -v ./internal/postgres -run '^TestM11(ConcurrentImportVsSellSerializes|ConcurrentSellVsSellNoOversell|ConcurrentCorrectionVsReversalSerializes|EffectiveLedgerProjectionEquivalence|XIRRReadDuringCorrectionCommittedStatesOnly)$'

  cancellation-runtime-role:
    name: C cancellation and PostgreSQL runtime role
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Configure runtime role
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 < infrastructure/postgres/runtime/openinvest_runtime_role.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openinvest_runtime_ci') THEN
                  CREATE ROLE openinvest_runtime_ci LOGIN PASSWORD 'openinvest-runtime-ci';
              END IF;
          END
          $$;
          GRANT openinvest_runtime TO openinvest_runtime_ci;
          SQL
      - name: Run cancellation and runtime role attacks
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_DATABASE_RUNTIME_TEST_URL: postgres://openinvest_runtime_ci:openinvest-runtime-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -euo pipefail
          go test -count=1 -v ./internal/postgres -run '^TestM11CancellationReplayAtomicity$'
          go test -count=1 -v ./internal/postgres -run '^TestStage0333(RuntimeRoleCanAppendButCannotMutateLedger|OpenRuntimeRejectsPrivilegedSessionMaskedBySetRole|OpenRuntimeRejectsLatentSetRoleMutationPath|OpenRuntimeRejectsLatentAdminOptionMutationPath)$'

  http-provider:
    name: D HTTP parser rate-limit provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Run group D
        working-directory: backend-go
        run: go test -count=1 -v ./internal/httpapi -run '^TestM11'

  frontend-contract:
    name: E frontend backend security contract
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - name: Enable pinned pnpm
        working-directory: frontend-next
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: Install frozen dependencies
        working-directory: frontend-next
        run: pnpm install --frozen-lockfile
      - name: Run Module 11 frontend contract tests
        working-directory: frontend-next
        run: node --experimental-strip-types --test tests/module11-security-contract.test.mjs

  stateful-fuzz:
    name: F stateful property and fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Run 1000 x 50 stateful position campaign
        working-directory: backend-go
        run: go test -count=1 -v ./internal/position -run '^TestM11StatefulPositionRebuildEquivalence$'
      - name: Run cross-module fuzz targets
        working-directory: backend-go
        shell: bash
        run: |
          set -euo pipefail
          run_fuzz() {
            package="$1"
            target="$2"
            start="$(date +%s)"
            go test "$package" -run='^$' -fuzz="^${target}$" -fuzztime=5s -parallel=1
            finish="$(date +%s)"
            echo "M11_FUZZ_TARGET=${target} DURATION_SECONDS=$((finish-start))"
          }
          run_fuzz ./internal/httpapi FuzzM11StrictJSONDecoder
          run_fuzz ./internal/httpapi FuzzM11ProviderCanonicalRequestKey
          run_fuzz ./internal/importer FuzzM11CSVReviewSemantics
          run_fuzz ./internal/position FuzzM11PositionPipeline
          run_fuzz ./internal/verticalslice FuzzM11CommandIdentity
          run_fuzz ./internal/verticalslice FuzzM11DecimalCashXIRRPipeline

  preflight-v2:
    name: V2 preflight compile and identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - name: Print exact audit identity
        run: |
          echo "M11_V2_HEAD=$(git rev-parse HEAD)"
          echo "M11_V2_TREE=$(git rev-parse HEAD^{tree})"
      - name: Compile new Go audit tests
        working-directory: backend-go
        run: go test ./internal/httpapi ./internal/importer ./internal/postgres -run '^$'
      - name: Validate frontend audit test syntax
        working-directory: frontend-next
        run: node --check tests/module11-security-contract.test.mjs

  challenger-a2-auth-csrf-authorization:
    name: A2 HTTP auth CSRF authorization
    needs: preflight-v2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Run real HTTP CSRF matrix
        working-directory: backend-go
        run: go test -count=1 -v ./internal/httpapi -run '^TestM11V2(CSRF|Logout)'
      - name: Run PostgreSQL-backed protected mutation matrix
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: go test -count=1 -v ./internal/postgres -run '^TestM11V2ProtectedMutationAuthorizationHTTP$'

  challenger-b2-cancellation:
    name: B2 cancellation phase challenger
    needs: preflight-v2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Run DB cancellation atomicity witness
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: go test -count=1 -v ./internal/postgres -run '^TestM11CancellationReplayAtomicity$'
      - name: Run repeated provider cancellation recovery
        working-directory: backend-go
        env:
          OPENINVEST_M11_V2_EXPENSIVE: "1"
        run: go test -count=1 -v ./internal/httpapi -run '^TestM11V2RepeatedProviderConcurrencyCampaign$'

  challenger-c2-parser-routing:
    name: C2 parser routing hostile matrix
    needs: preflight-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Run hostile parser matrix and route regressions
        working-directory: backend-go
        run: |
          go test -count=1 -v ./internal/httpapi -run '^(TestM11V2HTTPParserRoutingHostileMatrix|TestTransactionRoutesRejectMalformedUUIDsBeforeStoreWork|TestPWEL002MalformedPortfolioUUIDFailsBeforeDownstreamWork|TestStage329StrictJSONRejectsUnknownPortfolioField|TestStage329StrictJSONRejectsUnknownTransactionField|TestStage329InvalidAndOversizedDecimalsReturn400BeforeStore|TestStage329DuplicateCSVHeaderReturns400)$'

  challenger-d2-concurrency:
    name: D2 PostgreSQL concurrency race matrix
    needs: preflight-v2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Run repeated real DB concurrency matrix under race detector
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_M11_V2_EXPENSIVE: "1"
        run: go test -race -count=1 -v ./internal/postgres -run '^TestM11V2RepeatedConcurrencyCampaign$'

  challenger-e2-csv-reference:
    name: E2 CSV adversarial reference campaign
    needs: preflight-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Run deterministic CSV campaign
        working-directory: backend-go
        run: go test -count=1 -v ./internal/importer -run '^TestM11V2CSVAdversarialCampaign$'

  challenger-f2-full-system-state:
    name: F2 full system PostgreSQL state machine
    needs: preflight-v2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Run generated full system campaign
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_M11_V2_EXPENSIVE: "1"
        run: go test -count=1 -v ./internal/postgres -run '^TestM11V2FullSystemStatefulCampaign$'

  challenger-g2-fuzz:
    name: G2 dedicated cross module fuzz
    needs: preflight-v2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        run: OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Fuzz route UUID plus authorization
        working-directory: backend-go
        run: go test ./internal/httpapi -run='^$' -fuzz='^FuzzM11RouteUUIDAuthorization$' -fuzztime=15s -parallel=1
      - name: Fuzz correction reversal state machine
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: go test ./internal/postgres -run='^$' -fuzz='^FuzzM11CorrectionReversalStateMachine$' -fuzztime=15s -parallel=1

  challenger-h2-oracle-leakage:
    name: H2 error oracle leakage challenger
    needs: preflight-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Run mapped error and infrastructure leakage witnesses
        working-directory: backend-go
        run: |
          go test -count=1 -v ./internal/httpapi -run '^(TestM11NotFoundErrorOracleUniform|TestAuthInfrastructureFailuresUseSanitizedInternalError)$'

