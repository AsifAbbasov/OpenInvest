name: Module 1 isolated real crash and recovery (collect all)
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  postgres-and-worker-chaos:
    name: isolated PG18 crash / ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        case:
          - EightRealSIGKILLWorkersAndRecovery
          - PostgresAbruptKillWALRecovery
          - NetworkDisconnectRollsBackAndCanRetry
          - CommitAmbiguityAfterPostmasterCrash
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout immutable audit head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin exact SHA and tree
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Install pinned Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Canonical migrations, disposable database only
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Assert exactly one disposable PostgreSQL service container
        run: |
          set -euo pipefail
          docker ps --filter ancestor=postgres:18 --format '{{.ID}}' > /tmp/chaos-postgres-services
          test "$(wc -l < /tmp/chaos-postgres-services)" -eq 1
          ID="$(cat /tmp/chaos-postgres-services)"
          test -n "$ID"
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${RUNNER_ENVIRONMENT:-}" = "github-hosted"
          test "$(docker inspect --format '{{.Config.Image}}' "$ID")" = "postgres:18"
          test "$(docker inspect --format '{{.State.Status}}' "$ID")" = "running"
          echo "OPENINVEST_CHAOS_PG_CONTAINER=$ID" >> "$GITHUB_ENV"
          echo "DISPOSABLE_PG_CONTAINER_IDENTIFIED=YES VERIFIED_GITHUB_HOSTED=YES POSTGRES_IMAGE=postgres:18"
      - name: Real OS process and database kill scenario
        working-directory: backend-go
        env:
          OPENINVEST_CHAOS_ISOLATED: YES_DISPOSABLE_GITHUB_RUNNER
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          CASE: ${{ matrix.case }}
        run: |
          set -uo pipefail
          echo "CASE_START=$CASE"
          TEST_NAME="TestModule1Chaos${CASE}"
          go test ./internal/postgres -list "^${TEST_NAME}$" | grep -Fx "$TEST_NAME"
          DISCOVERY_RESULT=$?
          if [ "$DISCOVERY_RESULT" -ne 0 ]; then
            echo "TEST_DISCOVERY_FAILED=$TEST_NAME"
            exit "$DISCOVERY_RESULT"
          fi
          go test -race -v ./internal/postgres -run "^${TEST_NAME}$" -count=1 -timeout=11m
          RESULT=$?
          echo "CASE_END=$CASE STATUS=$RESULT"
          exit "$RESULT"
      - name: Preserve real PostgreSQL crash logs on every outcome
        if: always()
        run: |
          set -uo pipefail
          if [ -n "${OPENINVEST_CHAOS_PG_CONTAINER:-}" ]; then
            docker inspect --format 'FINAL_POSTGRES_CONTAINER={{.Id}} STATUS={{.State.Status}} EXIT_CODE={{.State.ExitCode}} IMAGE={{.Config.Image}}' "$OPENINVEST_CHAOS_PG_CONTAINER" || true
            docker logs --tail 120 "$OPENINVEST_CHAOS_PG_CONTAINER" 2>&1 | grep -E 'automatic recovery in progress|redo starts at|redo done at|database system is ready|database system was interrupted' || true
          fi

  real-nextjs-chromium-smoke:
    name: real Next.js server + Chromium (navigation smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Pin head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - name: Install Next.js and build
        working-directory: frontend-next
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Launch real Next.js and browse in headless Chromium
        working-directory: frontend-next
        run: |
          set -uo pipefail
          pnpm exec next start --hostname 127.0.0.1 --port 3000 > /tmp/oi-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          ready=0
          for n in $(seq 1 45); do
            curl --silent --fail http://127.0.0.1:3000/auth/verify > /tmp/oi-next-page && { ready=1; break; }
            sleep 1
          done
          test "$ready" -eq 1 || { cat /tmp/oi-next.log; exit 12; }
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then echo "REAL_BROWSER=NOT_EXECUTED_CHROME_UNAVAILABLE"; exit 13; fi
          timeout 30 "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=1500 --dump-dom "http://127.0.0.1:3000/auth/verify#AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" > /tmp/oi-rendered-dom
          result=$?
          if [ "$result" -ne 0 ]; then echo "CHROMIUM_RENDER_ERROR=$result"; exit "$result"; fi
          grep -q 'Complete email verification' /tmp/oi-rendered-dom || exit 14
          grep -q 'Create verified account' /tmp/oi-rendered-dom || exit 15
          echo "REAL_CHROMIUM_ON_LIVE_NEXTJS=PASS"
          echo "FULL_NEXT_ROUTER_INTERACTIONS=NOT_VERIFIED"
          echo "POLLING_PERFORMANCE_PROFILING=NOT_VERIFIED"

  smtp-loopback-negative-tests:
    name: SMTP real TCP loopback STARTTLS downgrade + fail closed
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Independent SMTP protocol negative matrix
        working-directory: backend-go
        run: |
          set -euo pipefail
          go test -race -v ./internal/verificationmail -run '^TestEmailOwnershipIndependentSMTP' -count=1 -timeout=3m
          echo "REAL_EXTERNAL_SMTP=NOT_TESTED"
  bounded-endurance:
    name: independent bounded repeated race and state invariants (collect all)
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Migrate disposable database
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: All repetitions run even if earlier cases fail
        working-directory: backend-go
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -uo pipefail
          failures=0
          for n in $(seq 1 8); do
            echo "::group::INDEPENDENT_RECOVERY_RACE_REPETITION_$n"
            go test -race ./internal/postgres -run '^(TestEmailOwnershipFinalRenewalWhilePriorLeaseUnfinished|TestEmailOwnershipFinalReplacementLeaseAndStaleCallbacks|TestEmailOwnershipFinalExhaustionConcurrentRecoveryAndLateCompletion|TestEmailOwnershipConcurrentRenewalAndRecovery|TestEmailOwnershipRenewalRollbackOnJobFailure|TestEmailOwnershipIndependentFourthCrashTerminalState)$' -count=1 -timeout=90s
            rc=$?
            echo "::endgroup::"
            echo "ENDURANCE_REPETITION=$n EXIT=$rc"
            if [ "$rc" -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "ENDURANCE_FAILURES=$failures"
          exit "$failures"
