name: Module 1 real Next.js and Go HTTP PostgreSQL integration evidence
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    name: Real Chromium Next.js -> Go API -> PostgreSQL proof activation
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Freeze original product bytes and verify disposable runner
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          FROZEN=bcfbc2687b60c68b33a8c4b0fbe969952c649d7d
          test "$(git merge-base "$FROZEN" HEAD)" = "$FROZEN"
          test "$(git rev-parse "$FROZEN^{tree}")" = f0d56fb63076a8eaf32bc1f96fe0cdc4928bea96
          git diff --name-only "$FROZEN" HEAD > /tmp/real-browser-file-delta
          if grep -Ev '^(\.github/workflows/module1-real-backend-browser\.yml|backend-go/cmd/module1_audit_live_browser_seed/main\.go|frontend-next/tests/module1_real_backend_postgres_browser_e2e\.mjs)$' /tmp/real-browser-file-delta; then
            echo "PRODUCTION_BLOB_CHANGED"
            exit 1
          fi
          echo PRODUCTION_CONTENT_IDENTICAL_TO_PR260=YES
          echo TESTED_SHA=$(git rev-parse HEAD)
          echo TESTED_TREE=$(git rev-parse HEAD^{tree})
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - name: Apply migrations on synthetic disposable PG18
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
          docker ps --filter ancestor=postgres:18 --format '{{.ID}}' > /tmp/module1-live-container
          test "$(wc -l < /tmp/module1-live-container)" -eq 1
          ID="$(cat /tmp/module1-live-container)"
          test "$(docker inspect --format '{{.Config.Image}}' "$ID")" = postgres:18
          echo "OPENINVEST_CHAOS_PG_CONTAINER=$ID" >> "$GITHUB_ENV"
      - name: Build real Next.js App Router pointing at actual Go HTTP service
        working-directory: frontend-next
        env:
          NEXT_PUBLIC_OPENINVEST_API_BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Exercise full real browser -> backend -> SQL verification
        env:
          OPENINVEST_CHAOS_ISOLATED: YES_DISPOSABLE_GITHUB_RUNNER
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_AUDIT_PROOF_FILE: /tmp/module1-live-proof-0600.json
          DATABASE_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_ENV: development
          OPENINVEST_ACCESS_TOKEN_SECRET: local-audit-only-never-production-browser-key-2026
          OPENINVEST_ALLOWED_WEB_ORIGINS: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          (cd backend-go && go run ./cmd/module1_audit_live_browser_seed) > /tmp/module1-seed.log 2>&1
          test "$(stat -c %a "$OPENINVEST_AUDIT_PROOF_FILE")" = 600
          (cd backend-go && go run ./cmd/api) > /tmp/module1-live-api.log 2>&1 &
          API_PID=$!
          (cd frontend-next && pnpm exec next start --hostname 127.0.0.1 --port 3000) > /tmp/module1-live-next.log 2>&1 &
          NEXT_PID=$!
          PROFILE="$(mktemp -d)"
          CHROME_PID=''
          cleanup(){
            if [ -n "$CHROME_PID" ]; then kill "$CHROME_PID" 2>/dev/null || true; wait "$CHROME_PID" 2>/dev/null || true; fi
            kill "$API_PID" "$NEXT_PID" 2>/dev/null || true
            wait "$API_PID" "$NEXT_PID" 2>/dev/null || true
            rm -f "$OPENINVEST_AUDIT_PROOF_FILE"
            rm -rf "$PROFILE"
          }
          trap cleanup EXIT
          backend=0; frontend=0
          for n in $(seq 1 70); do
            if curl --silent --fail 'http://127.0.0.1:8080/api/v1/health' >/tmp/module1-health; then backend=1; break; fi
            sleep 1
          done
          if [ "$backend" -ne 1 ]; then tail -80 /tmp/module1-live-api.log; exit 31; fi
          for n in $(seq 1 70); do
            if curl --silent --fail 'http://127.0.0.1:3000/auth/verify' >/tmp/module1-next-page; then frontend=1; break; fi
            sleep 1
          done
          if [ "$frontend" -ne 1 ]; then tail -80 /tmp/module1-live-next.log; exit 32; fi
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$BROWSER" ]; then echo REAL_CHROMIUM=BLOCKED_INFRASTRUCTURE; exit 33; fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir="$PROFILE" about:blank > /tmp/module1-live-chrome.log 2>&1 &
          CHROME_PID=$!
          timeout 90 node frontend-next/tests/module1_real_backend_postgres_browser_e2e.mjs
          SQL="SELECT (SELECT count(*) FROM identity.users WHERE email_normalized='module1-live-browser-proof@example.test' AND account_state='active'),(SELECT count(*) FROM identity.sessions s JOIN identity.users u ON u.id=s.user_id WHERE u.email_normalized='module1-live-browser-proof@example.test'),(SELECT count(*) FROM identity.email_verification_tokens t JOIN identity.registration_intents i ON i.id=t.intent_id WHERE i.email_normalized='module1-live-browser-proof@example.test' AND t.consumed_at IS NOT NULL)"
          RESULT="$(docker exec "$OPENINVEST_CHAOS_PG_CONTAINER" psql -U openinvest -d openinvest -At -F ',' -c "$SQL")"
          if [ "$RESULT" != '1,0,1' ]; then echo "POSTGRES_PROOF_OR_SESSION_INVARIANT_FAIL_COUNTS=$RESULT"; exit 34; fi
          echo 'REAL_NEXTJS_APP_ROUTER_TO_REAL_GO_HTTP_TO_REAL_POSTGRESQL18=PASS'
          echo 'ACTIVE_VERIFIED_USER_COUNT=1 SESSION_CREATED_ON_ACTIVATION=0 CONSUMED_PROOF_COUNT=1'
      - name: Preserve failure screenshot and nonsecret logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module1-real-backend-browser-forensics
          path: |
            /tmp/module1-real-browser-failure.png
            /tmp/module1-live-api.log
            /tmp/module1-live-next.log
            /tmp/module1-live-chrome.log
          if-no-files-found: ignore
          retention-days: 7
