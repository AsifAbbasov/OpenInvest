name: Stage 3.73 docs closure applicator

on:
  push:
    branches:
      - docs/stage-03-73-lifecycle-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/stage-03-73-lifecycle-closure
          fetch-depth: 0
      - name: Apply exact post-merge documentation closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          MERGE = "683f9c4647f888bb3dbdfb9dd365b84b95137b46"
          HEAD = "a74fd85a46843ccdfe8192f2ac8687169a5a2ac7"
          RUN = "34109389368"

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # README
          p = "README.md"
          s = read(p)
          s = replace_once(
              s,
              "Stage 3.68 Dividend Calculator and Stages 3.71–3.73 portfolio position/cost-basis and Time Machine views are canonical once the Stage 3.73 implementation is protected-merged.",
              f"Stage 3.68 Dividend Calculator and Stages 3.71–3.73 portfolio position/cost-basis and Time Machine views are canonical; Stage 3.73 is protected-merged through PR #148 at `{MERGE}` after exact-head CI #424 on `{HEAD}` completed 10/10 SUCCESS.",
              "README Stage 3.73 lifecycle",
          )
          write(p, s)

          # Source of Truth
          p = "docs/SOURCE_OF_TRUTH.md"
          s = read(p)
          s = replace_once(s, "| Version | 1.4.96 |", "| Version | 1.4.97 |", "SOT version")
          s = replace_once(
              s,
              "**Documentation registry baseline: Stage 3.72 is the protected baseline before this Stage 3.73 candidate; once this Stage 3.73 implementation record is present on protected `develop`, README, Implementation Log, Roadmap, Document Index and Source of Truth are synchronized through Stage 3.73.**",
              f"**Documentation registry baseline: Stage 3.73 is canonical on protected `develop` through PR #148 squash merge `{MERGE}`; README, Implementation Log, Roadmap, Document Index, Source of Truth, Changelog, Version Matrix, Open Questions, governance reconciliation history, and the Stage 3.73 implementation dossier are synchronized through Stage 3.73.**",
              "SOT registry baseline",
          )
          s = replace_once(
              s,
              "**Implementation frontier: Stage 3.73 — Portfolio Time Machine / Historical Position View is merge-activated in this implementation record. Before protected activation, Stage 3.72 / PR #145 squash merge `e935f19b68624f0b8be6ca293ead8f4395cf555e` remains the last completed implementation stage; once this Stage 3.73 implementation is present on protected `develop`, Stage 3.73 is the last completed implementation stage.**",
              f"**Implementation frontier: Stage 3.73 — Portfolio Time Machine / Historical Position View is COMPLETE / CANONICAL through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` completed 10/10 SUCCESS. Stage 3.73 is the last completed implementation stage; any Stage 3.74+ runtime or architecture-changing scope requires a separately reviewed gate.**",
              "SOT implementation frontier",
          )
          s = replace_once(
              s,
              "Stage 3.73 reuses the same endpoint-local `asOfDate` projection for user-visible historical holdings, adds no financial engine/API/schema/provider, and keeps all market-derived fields unavailable.",
              f"Stage 3.73 is canonical through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` 10/10 SUCCESS; it reuses the same endpoint-local `asOfDate` projection for user-visible historical holdings, adds no financial engine/API/schema/provider, and keeps all market-derived fields unavailable.",
              "SOT portfolio lifecycle",
          )
          write(p, s)

          # Roadmap
          p = "docs/ROADMAP.md"
          s = read(p)
          old = "| 3.73 — Portfolio Time Machine / Historical Position View | Turn the existing Stage 3.72 endpoint-local `asOfDate` semantics into user-visible Current ↔ Historical position navigation without a second financial engine, new endpoint, table, cache or provider | Merge-activated implementation; canonical only when `STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md` and its runtime/test changes are present on protected `develop` |"
          new = f"| 3.73 — Portfolio Time Machine / Historical Position View | Turn the existing Stage 3.72 endpoint-local `asOfDate` semantics into user-visible Current ↔ Historical position navigation without a second financial engine, new endpoint, table, cache or provider | Complete / canonical through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` 10/10 SUCCESS; Stage 3.73 lifecycle/documentation closed by the protected merge and this post-merge registry synchronization |"
          s = replace_once(s, old, new, "ROADMAP Stage 3.73 row")
          write(p, s)

          # Document index
          p = "docs/DOCUMENT_INDEX.md"
          s = read(p)
          old = "| Stage 3.73 Portfolio Time Machine / Historical Position View | Merge-activated implementation over the existing Stage 3.72 `asOfDate` positions contract; Current ↔ Historical UI, stale-result protection and historical financial witnesses; no new endpoint/schema/provider | `stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md` |"
          new = f"| Stage 3.73 Portfolio Time Machine / Historical Position View | Complete/canonical through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` 10/10 SUCCESS; Current ↔ Historical UI, stale-result protection and historical financial witnesses over the existing Stage 3.72 `asOfDate` contract; no new endpoint/schema/provider | `stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md` |"
          s = replace_once(s, old, new, "DOCUMENT_INDEX Stage 3.73 row")
          anchor = "Stage 3.72 lifecycle/documentation closure is canonical through PR #146 squash merge `ac0396eff47ce5cd862f41a5ec8ab2803de7fa58`; it authorizes no later Portfolio Position / Cost Basis expansion, production rollout, imported SELL expansion, market provider/market-valued positions, XIRR/returns, correction/reversal, tax basis, bond NKD, notifications or AI."
          addition = anchor + f"\n\nStage 3.73 Portfolio Time Machine is complete/canonical through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` 10/10 SUCCESS. It is a Web/product projection over the existing Stage 3.72 `asOfDate` contract and authorizes no market provider activation, historical market-value/return calculation, new financial engine, API/schema expansion, tax-basis semantics, imported SELL expansion, privacy lifecycle, infrastructure expansion, notifications or AI."
          s = replace_once(s, anchor, addition, "DOCUMENT_INDEX closure paragraph")
          write(p, s)

          # Implementation log
          p = "docs/IMPLEMENTATION_LOG.md"
          s = read(p)
          s = replace_once(
              s,
              "| Next Review Date | Before any Stage 3.73+ runtime scope, provider/public activation, privacy-lifecycle implementation, tax-basis expansion, imported SELL expansion, or other architecture-changing work |",
              "| Next Review Date | Before any Stage 3.74+ runtime scope, provider/public activation, privacy-lifecycle implementation, tax-basis expansion, imported SELL expansion, or other architecture-changing work |",
              "IMPLEMENTATION_LOG next review",
          )
          old = "| 3.73 — Portfolio Time Machine / Historical Position View | Expose exact historical holdings by BusinessDate using the existing Stage 3.72 `asOfDate` projection and canonical Stage 3.71 position engine | Merge-activated implementation; no new API, schema, provider or financial algorithm | [Stage 3.73 report](stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md) |"
          new = f"| 3.73 — Portfolio Time Machine / Historical Position View | Expose exact historical holdings by BusinessDate using the existing Stage 3.72 `asOfDate` projection and canonical Stage 3.71 position engine | Complete / canonical through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` 10/10 SUCCESS; no new API, schema, provider or financial algorithm | [Stage 3.73 report](stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md) |"
          s = replace_once(s, old, new, "IMPLEMENTATION_LOG Stage 3.73 row")
          write(p, s)

          # Changelog
          p = "docs/CHANGELOG.md"
          s = read(p)
          s = replace_once(
              s,
              "| Next Review Date | Before any Stage 3.73+ runtime scope or architecture-changing provider, privacy, valuation, tax-basis, import, or infrastructure decision |",
              "| Next Review Date | Before any Stage 3.74+ runtime scope or architecture-changing provider, privacy, valuation, tax-basis, import, or infrastructure decision |",
              "CHANGELOG next review",
          )
          marker = "## 2026-09-07 — Repository documentation reconciliation through Stage 3.72"
          entry = f"""## 2026-09-07 — Stage 3.73 Portfolio Time Machine lifecycle closure\n\n- Stage 3.73 runtime/product implementation is COMPLETE / CANONICAL through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}`.\n- CI #424 / run `{RUN}` completed all 10 required jobs successfully before protected merge.\n- The Time Machine reuses the Stage 3.72 endpoint-local `asOfDate` projection and canonical Stage 3.71 ledger/WAC engine; no second financial engine, new API endpoint, database table, provider, cache or paid service was added.\n- Historical mode exposes exact BusinessDate holdings, WAC, acquisition basis and acquisition-basis weights while keeping market-derived valuation unavailable and hiding current-only summary metrics.\n- Post-merge documentation synchronization updates README, Source of Truth, Roadmap, Document Index, Implementation Log, Changelog, Version Matrix, Open Questions, the governance reconciliation history and the Stage 3.73 implementation dossier.\n- Next product/runtime work begins at a separately reviewed Stage 3.74+ gate.\n\n""" + marker
          s = replace_once(s, marker, entry, "CHANGELOG Stage 3.73 entry")
          write(p, s)

          # Version matrix
          p = "docs/VERSION_MATRIX.md"
          s = read(p)
          s = replace_once(s, "| Version | 1.2.0 |", "| Version | 1.2.1 |", "VERSION_MATRIX version")
          s = replace_once(
              s,
              "| Next Review Date | Before any Stage 3.73+ runtime scope or architecture-changing provider/public activation, privacy, valuation, tax-basis, import, or infrastructure decision |",
              "| Next Review Date | Before any Stage 3.74+ runtime scope or architecture-changing provider/public activation, privacy, valuation, tax-basis, import, or infrastructure decision |",
              "VERSION_MATRIX next review",
          )
          anchor = "| ADR-009 deterministic portfolio ledger ordering and WAC | 1.0.0 | Accepted / canonical through PR #137; runtime semantics implemented by Stage 3.71 | 3 | Principal Architect | Before any change to ledger ordering, WAC or acquisition-basis semantics |"
          row = anchor + f"\n| Stage 3.73 Portfolio Time Machine / Historical Position View | 1.0.0 | Complete / canonical through PR #148 squash merge `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` 10/10 SUCCESS; reuses Stage 3.72 `asOfDate`; no new engine/API/schema/provider | 3 | Principal Architect | Before any Stage 3.74+ position-history, valuation, provider, tax-basis or accounting-semantics expansion |"
          s = replace_once(s, anchor, row, "VERSION_MATRIX Stage 3.73 row")
          write(p, s)

          # Open Questions
          p = "docs/OPEN_QUESTIONS.md"
          s = read(p)
          s = replace_once(
              s,
              "| Next Review Date | Before any new architecture decision affecting provider/public activation, market valuation, privacy lifecycle, tax basis, imported SELL semantics, or Stage 3.73+ scope, or 2026-12-19, whichever comes first |",
              "| Next Review Date | Before any new architecture decision affecting provider/public activation, market valuation, privacy lifecycle, tax basis, imported SELL semantics, or Stage 3.74+ scope, or 2026-12-19, whichever comes first |",
              "OPEN_QUESTIONS next review",
          )
          s = replace_once(
              s,
              "None. Stage 3.72 is implemented and documentation-closed; it does not leave an unresolved architecture question. Any future market provider/valuation, broader cost-basis/tax-lot semantics, imported SELL expansion or privacy-lifecycle implementation must enter this register if it changes frozen architecture.",
              f"None. Stage 3.73 is implemented and canonical through PR #148 squash merge `{MERGE}` after exact-head CI #424; it introduces no unresolved architecture question because it reuses the existing Stage 3.72 `asOfDate` projection without a new financial engine, API/schema, provider or market valuation. Any future Stage 3.74+ market provider/valuation, broader cost-basis/tax-lot semantics, imported SELL expansion or privacy-lifecycle implementation must enter this register if it changes frozen architecture.",
              "OPEN_QUESTIONS current state",
          )
          write(p, s)

          # Historical repository reconciliation record
          p = "docs/governance/REPOSITORY_DOCUMENTATION_RECONCILIATION.md"
          s = read(p)
          s = replace_once(
              s,
              "No Stage 3.73 work is implied. Any new product/runtime stage must be separately planned and reviewed.",
              f"This reconciliation remains the historical canonical synchronization baseline through Stage 3.72. Stage 3.73 subsequently became COMPLETE / CANONICAL through PR #148 squash merge `{MERGE}` after exact-head CI #424; no Stage 3.74 work is implied by this historical reconciliation or by the Stage 3.73 closure. Any new product/runtime stage must be separately planned and reviewed.",
              "repository reconciliation next gate",
          )
          write(p, s)

          # Stage 3.73 dossier
          p = "docs/stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION.md"
          s = read(p)
          s = replace_once(
              s,
              "| Status | MERGE-ACTIVATED IMPLEMENTATION — canonical only when this implementation is present on protected `develop` |",
              f"| Status | COMPLETE / CANONICAL — PR #148 squash-merged into protected `develop` at `{MERGE}` from exact final head `{HEAD}` after CI #424 / run `{RUN}` 10/10 SUCCESS |",
              "Stage 3.73 dossier status",
          )
          if "## Post-merge lifecycle closure" not in s:
              s = s.rstrip() + f"""\n\n## Post-merge lifecycle closure\n\nStage 3.73 passed final implementation review and exact-head CI #424 / run `{RUN}` with all 10 required jobs SUCCESS on `{HEAD}`. After explicit human authorization, PR #148 was squash-merged into protected `develop` at `{MERGE}` on 2026-09-07.\n\nThe protected merge makes this implementation canonical. The delivered capability is intentionally limited to historical position reconstruction over the existing Stage 3.72 `asOfDate` contract and Stage 3.71 accounting engine. It does not activate a market provider, historical market value, P/L/returns, a second financial engine, a new API/schema/table, tax basis, imported SELL expansion, privacy lifecycle, infrastructure expansion, notifications or AI.\n\nExpected product result: a user can switch Current ↔ Historical, select an exact BusinessDate, and see the canonical open positions that existed on that date with authoritative quantity, WAC, acquisition basis and acquisition-basis weight. Closed-now positions can reappear historically when ledger truth requires it; market valuation remains explicitly unavailable.\n\nThe next runtime/product increment, if any, begins at a separately planned and reviewed Stage 3.74+ gate.\n"""
          write(p, s)
          PY

          allowed='^(README\.md|docs/(SOURCE_OF_TRUTH\.md|ROADMAP\.md|DOCUMENT_INDEX\.md|IMPLEMENTATION_LOG\.md|CHANGELOG\.md|VERSION_MATRIX\.md|OPEN_QUESTIONS\.md|governance/REPOSITORY_DOCUMENTATION_RECONCILIATION\.md|stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION\.md)|\.github/workflows/stage373-doc-closure\.yml)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected paths changed:"
            echo "$bad"
            exit 1
          fi

          rm .github/workflows/stage373-doc-closure.yml
          git config user.name "asifabbasov"
          git config user.email "aassifabbasov@gmail.com"
          git add README.md docs .github/workflows/stage373-doc-closure.yml
          git diff --cached --check
          git commit -m "docs: close Stage 3.73 lifecycle"
          git push origin HEAD:docs/stage-03-73-lifecycle-closure
