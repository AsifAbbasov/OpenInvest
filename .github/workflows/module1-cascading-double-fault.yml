name: Module 1 cascading double-fault independent security gate
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cascade:
    name: "Isolated PG18 double fault / ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        case: [LostFinancialAckAndPhysicalCrashSameOperation, TwelveBlockedFinancialWritesAndRealSIGKILL]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify frozen product blobs, checked out commit and hosted isolation
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          FROZEN=bcfbc2687b60c68b33a8c4b0fbe969952c649d7d
          test "$(git rev-parse "$FROZEN^{tree}")" = f0d56fb63076a8eaf32bc1f96fe0cdc4928bea96
          test "$(git merge-base "$FROZEN" HEAD)" = "$FROZEN"
          git diff --name-only "$FROZEN" HEAD > /tmp/changed-paths
          cat /tmp/changed-paths
          if grep -Ev '^(backend-go/internal/postgres/module1_cascading_double_fault_test\.go|\.github/workflows/module1-cascading-double-fault\.yml)$' /tmp/changed-paths; then
            echo "FAIL: a product or unexpected path changed"
            exit 1
          fi
          test "$(git ls-tree "$FROZEN" backend-go/internal/auth/tokens.go | cut -f1)" = "$(git ls-tree HEAD backend-go/internal/auth/tokens.go | cut -f1)"
          echo PRODUCTION_CONTENT_IDENTICAL_TO_PR260=YES
          echo TESTED_SHA=$(git rev-parse HEAD)
          echo TESTED_TREE=$(git rev-parse HEAD^{tree})
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Migrate disposable PostgreSQL
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Assert exact disposable crash target
        run: |
          set -euo pipefail
          docker ps --filter ancestor=postgres:18 --format '{{.ID}}' > /tmp/cascade-postgres
          test "$(wc -l < /tmp/cascade-postgres)" -eq 1
          ID="$(cat /tmp/cascade-postgres)"
          test "$(docker inspect --format '{{.Config.Image}}' "$ID")" = "postgres:18"
          echo "OPENINVEST_CHAOS_PG_CONTAINER=$ID" >> "$GITHUB_ENV"
      - name: Run independent double-fault with race detector
        working-directory: backend-go
        env:
          OPENINVEST_CHAOS_ISOLATED: YES_DISPOSABLE_GITHUB_RUNNER
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          TEST="TestModule1Cascade$CASE"
          go test ./internal/postgres -list "^$TEST$" | grep -Fx "$TEST"
          go test -race -v ./internal/postgres -run "^$TEST$" -count=1 -timeout=11m
