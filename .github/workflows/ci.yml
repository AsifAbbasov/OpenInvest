name: Stage 3.34 lockfile promoter

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  promote-lockfile:
    name: Promote verified Next.js lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/stage-03-34-ci-security-hardening-final
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: Regenerate lockfile from reviewed package manifest
        working-directory: frontend-next
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify byte-for-byte candidate digest
        working-directory: frontend-next
        run: echo "f492c1d06aff6bed6e21d839fc510e3402615fa624ef59215d9b12c444314336  pnpm-lock.yaml" | sha256sum -c -
      - name: Commit only the verified lockfile
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no | grep -v '^ M frontend-next/pnpm-lock.yaml$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-next/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "security: refresh Next.js lockfile"
          git push origin HEAD:fix/stage-03-34-ci-security-hardening-final
