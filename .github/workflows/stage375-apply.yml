name: Stage 3.75 implementation applicator

on:
  push:
    branches:
      - feat/stage-03-75-cash-flow-income-truth

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-03-75-cash-flow-income-truth
          fetch-depth: 0
      - name: Apply Stage 3.75 patches
        run: |
          python3 scripts/stage375_repair_applicator.py
          python3 scripts/stage375_apply.py
      - name: Remove one-shot applicator and commit product diff
        run: |
          git rm -f .github/workflows/stage375-apply.yml scripts/stage375_apply.py scripts/stage375_repair_applicator.py
          git add README.md docs openapi backend-go frontend-next
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement Stage 3.75 cash-flow and income truth"
          git push origin HEAD:feat/stage-03-75-cash-flow-income-truth
