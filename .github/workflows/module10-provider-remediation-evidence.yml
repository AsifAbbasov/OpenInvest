name: Module 10 Provider Remediation Evidence

on:
  push:
    branches:
      - remediation/module10-provider-budget-abuse-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    name: Module 10 remediation targeted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Run remediation security tests
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/httpapi -run '^TestModule10Remediation' 2>&1 | tee /tmp/module10-remediation-targeted.log
      - name: Materialize prior provider hostile tests
        working-directory: .
        run: |
          git show f995d3f97d8c5e203aef6254e7e19162da6ae2b6:backend-go/internal/provider/tinvest/module10_adversarial_audit_test.go > backend-go/internal/provider/tinvest/module10_adversarial_audit_test.go
          git show f995d3f97d8c5e203aef6254e7e19162da6ae2b6:backend-go/internal/provider/moexiss/module10_adversarial_audit_test.go > backend-go/internal/provider/moexiss/module10_adversarial_audit_test.go
      - name: Re-run hostile provider resilience suite
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/provider/tinvest -run '^TestModule10' 2>&1 | tee /tmp/module10-remediation-tinvest-hostile.log
          go test -count=1 -v ./internal/provider/moexiss -run '^TestModule10' 2>&1 | tee /tmp/module10-remediation-moex-hostile.log
      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module10-remediation-targeted-evidence
          path: |
            /tmp/module10-remediation-targeted.log
            /tmp/module10-remediation-tinvest-hostile.log
            /tmp/module10-remediation-moex-hostile.log
          if-no-files-found: error

  go-tests:
    name: Remediation full Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        working-directory: .
        run: OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Configure runtime role
        working-directory: .
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 < infrastructure/postgres/runtime/openinvest_runtime_role.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openinvest_runtime_ci') THEN
              CREATE ROLE openinvest_runtime_ci LOGIN PASSWORD 'openinvest-runtime-ci';
            END IF;
          END
          $$;
          GRANT openinvest_runtime TO openinvest_runtime_ci;
          SQL
      - name: go test ./...
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_DATABASE_RUNTIME_TEST_URL: postgres://openinvest_runtime_ci:openinvest-runtime-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: go test ./...

  go-race:
    name: Remediation Go race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations
        working-directory: .
        run: OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Configure runtime role
        working-directory: .
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 < infrastructure/postgres/runtime/openinvest_runtime_role.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openinvest_runtime_ci') THEN
              CREATE ROLE openinvest_runtime_ci LOGIN PASSWORD 'openinvest-runtime-ci';
            END IF;
          END
          $$;
          GRANT openinvest_runtime TO openinvest_runtime_ci;
          SQL
      - name: go test -race ./...
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_DATABASE_RUNTIME_TEST_URL: postgres://openinvest_runtime_ci:openinvest-runtime-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: go test -race ./...

  static-contract:
    name: Remediation vet and OpenAPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Go vet
        working-directory: backend-go
        run: go vet ./...
      - name: OpenAPI contract
        working-directory: backend-go
        run: go run ./cmd/validate-openapi

  frontend:
    name: Remediation frontend regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm run typecheck
      - name: Frontend tests
        run: pnpm test
      - name: Frontend build
        run: pnpm run build

  security:
    name: Remediation dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Go vulnerability scan
        working-directory: backend-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          $(go env GOPATH)/bin/govulncheck ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - run: corepack enable && corepack prepare pnpm@11.8.0 --activate
      - name: pnpm audit
        working-directory: frontend-next
        run: pnpm audit

  final:
    name: Final remediation evidence enforcement
    if: always()
    needs: [targeted, go-tests, go-race, static-contract, frontend, security]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        env:
          TARGETED: ${{ needs.targeted.result }}
          GO_TESTS: ${{ needs.go-tests.result }}
          GO_RACE: ${{ needs.go-race.result }}
          STATIC_CONTRACT: ${{ needs.static-contract.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          printf 'TARGETED=%s\nGO_TESTS=%s\nGO_RACE=%s\nSTATIC_CONTRACT=%s\nFRONTEND=%s\nSECURITY=%s\n'             "$TARGETED" "$GO_TESTS" "$GO_RACE" "$STATIC_CONTRACT" "$FRONTEND" "$SECURITY"
          test "$TARGETED" = success
          test "$GO_TESTS" = success
          test "$GO_RACE" = success
          test "$STATIC_CONTRACT" = success
          test "$FRONTEND" = success
          test "$SECURITY" = success
