name: Stage 3.73 docs closure retry

on:
  push:
    branches:
      - docs/stage-03-73-lifecycle-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: docs/stage-03-73-lifecycle-closure
          fetch-depth: 0
      - name: Apply idempotent post-merge documentation closure
        shell: bash
        run: |
          python3 scripts/stage373_doc_closure.py

          allowed='^(README\.md|docs/(SOURCE_OF_TRUTH\.md|ROADMAP\.md|DOCUMENT_INDEX\.md|IMPLEMENTATION_LOG\.md|CHANGELOG\.md|VERSION_MATRIX\.md|OPEN_QUESTIONS\.md|governance/REPOSITORY_DOCUMENTATION_RECONCILIATION\.md|stages/STAGE_03_73_PORTFOLIO_TIME_MACHINE_IMPLEMENTATION\.md)|\.github/workflows/stage373-doc-closure\.yml|\.github/workflows/stage373-doc-closure-retry\.yml|scripts/stage373_doc_closure\.py)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected paths changed:"
            echo "$bad"
            exit 1
          fi

          rm -f .github/workflows/stage373-doc-closure.yml
          rm -f .github/workflows/stage373-doc-closure-retry.yml
          rm -f scripts/stage373_doc_closure.py

          git config user.name "asifabbasov"
          git config user.email "aassifabbasov@gmail.com"
          git add README.md docs .github/workflows scripts/stage373_doc_closure.py
          git diff --cached --check
          git commit -m "docs: close Stage 3.73 lifecycle"
          git push origin HEAD:docs/stage-03-73-lifecycle-closure
