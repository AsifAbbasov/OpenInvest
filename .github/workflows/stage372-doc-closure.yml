name: Stage 3.72 documentation closure applicator

on:
  push:
    branches:
      - docs/stage-03-72-runtime-closure

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: execute Stage 3.72 documentation closure'
    runs-on: ubuntu-latest
    steps:
      - name: Check out closure branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Apply documentation synchronization
        run: python3 .stage372_docs_apply.py
      - name: Remove temporary applicator files
        run: rm -f .stage372_docs_apply.py .github/workflows/stage372-doc-closure.yml
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit and push documentation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "docs: close Stage 3.72 portfolio position projection lifecycle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
