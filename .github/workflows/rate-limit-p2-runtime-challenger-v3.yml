name: Audit P2 Runtime Challenger V3

on:
  push:
    branches:
      - audit/rate-limit-p2-runtime-challenger-v3

permissions:
  contents: read

concurrency:
  group: audit-p2-runtime-challenger-v3
  cancel-in-progress: true

jobs:
  runtime-challenger:
    name: P2 runtime challenger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out exact audit branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Assert protected baseline parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 5357900e71e1e6f27907f304d59b20490a3b081d HEAD
          test "$(git rev-parse 5357900e71e1e6f27907f304d59b20490a3b081d^{tree})" = "a5bc1f547055b60958c8306745b5f36872cb762a"
          git diff --name-only 5357900e71e1e6f27907f304d59b20490a3b081d...HEAD
          test -z "$(git diff --name-only 5357900e71e1e6f27907f304d59b20490a3b081d...HEAD | grep -Ev '^(\.github/workflows/rate-limit-p2-runtime-challenger-v3\.yml|scripts/audit-rate-limit-p2-v3\.py|backend-go/internal/postgres/p2_runtime_challenger_v3_test\.go)$' || true)"

      - name: Apply canonical PostgreSQL migrations
        env:
          OPENINVEST_DATABASE_OWNER_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set -euo pipefail
          bash scripts/apply-migrations.sh

      - name: Configure canonical R0 runtime role
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}"             psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 -v runtime_capability_profile=R0             < infrastructure/postgres/runtime/openinvest_runtime_role.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -U openinvest -d openinvest -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'openinvest_runtime_ci') THEN
                  CREATE ROLE openinvest_runtime_ci
                      LOGIN
                      PASSWORD 'openinvest-runtime-ci'
                      NOSUPERUSER
                      NOCREATEDB
                      NOCREATEROLE
                      NOREPLICATION
                      NOBYPASSRLS;
              END IF;
          END
          $$;
          GRANT openinvest_runtime TO openinvest_runtime_ci;
          SQL

      - name: Build exact-tree API binary
        working-directory: backend-go
        run: |
          set -euo pipefail
          go build -trimpath -o "${RUNNER_TEMP}/openinvest-api" ./cmd/api
          "${RUNNER_TEMP}/openinvest-api" --help >/dev/null 2>&1 || true

      - name: Execute real PostgreSQL runtime challenger
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          OPENINVEST_P2_API_BIN: ${{ runner.temp }}/openinvest-api
          OPENINVEST_P2_RUNTIME_URL: postgres://openinvest_runtime_ci:openinvest-runtime-ci@127.0.0.1:5432/openinvest?sslmode=disable
          OPENINVEST_P2_OWNER_DB: openinvest
          OPENINVEST_P2_RESULTS_DIR: ${{ runner.temp }}/openinvest-p2-v3
        run: |
          set -euo pipefail
          python3 scripts/audit-rate-limit-p2-v3.py

      - name: Dump raw challenger evidence
        if: always()
        run: |
          set +e
          echo '=== AUDIT BRANCH IDENTITY ==='
          git rev-parse HEAD
          git show -s --format='%H %T %P %s' HEAD
          echo '=== RESULTS JSON ==='
          cat "${RUNNER_TEMP}/openinvest-p2-v3/results.json" 2>/dev/null || true
          echo '=== API1 LOG ==='
          cat "${RUNNER_TEMP}/openinvest-p2-v3/oi-p2-v3-api1.log" 2>/dev/null || true
          echo '=== API2 LOG ==='
          cat "${RUNNER_TEMP}/openinvest-p2-v3/oi-p2-v3-api2.log" 2>/dev/null || true
