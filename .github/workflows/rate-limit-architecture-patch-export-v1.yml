name: Export Rate Limit Architecture Hardening Patch V1

on:
  push:
    branches:
      - audit/rate-limit-architecture-hardening-v1-followup

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Generate exact remediation patch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openinvest-patch"
          patch="$RUNNER_TEMP/openinvest-patch/RATE_LIMITING_ARCHITECTURE_HARDENING_V1.patch"
          git diff --binary 5357900e71e1e6f27907f304d59b20490a3b081d..81d930875eb424256330ab9e35ef611660c57357 --             .             ':(exclude).github/workflows/rate-limit-architecture-hardening-v1.yml'             ':(exclude)scripts/audit-rate-limit-architecture-hardening-v1.py'             > "$patch"
          sha256sum "$patch" > "$RUNNER_TEMP/openinvest-patch/RATE_LIMITING_ARCHITECTURE_HARDENING_V1.patch.sha256"
          git worktree add --detach "$RUNNER_TEMP/patch-check" 5357900e71e1e6f27907f304d59b20490a3b081d
          (cd "$RUNNER_TEMP/patch-check" && git apply --check "$patch")
      - name: Upload exact patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rate-limiting-architecture-hardening-v1-patch
          path: ${{ runner.temp }}/openinvest-patch/
          if-no-files-found: error
          retention-days: 1
