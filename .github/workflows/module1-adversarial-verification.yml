          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Existing auth regressions under race detector
        run: |
          set -euo pipefail
          go test -race ./internal/auth -run '^(TestService|TestPassword|TestStage337)' -count=1 -timeout=8m
          go test -race ./internal/httpapi -run 'TestAuthRefreshRequiresCSRFAndRejectsReplay|TestAuthLogoutClearsRefreshCookie|TestAuthInfrastructureFailuresUseSanitizedInternalError|TestSensitiveResponseCachePolicyCoversAuthLifecycleAndErrors|TestAuthRegisterSetsHttpOnlyRefreshCookieWithoutBodyLeak' -count=1 -timeout=8m


  auth-parser-fuzz:
    name: auth-parser-fuzz
    env:
      OPENINVEST_MODULE1_ADVERSARIAL: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Exact-head lock
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Email normalization fuzz campaign
        id: email_normalization_fuzz
        continue-on-error: true
        run: |
          set -euo pipefail
          go test ./internal/auth -run '^$' -fuzz '^FuzzModule1EmailNormalizationProperties$' -fuzztime=30s -timeout=2m
      - name: Authorization parser fuzz campaign
        id: bearer_parser_fuzz
        continue-on-error: true
        run: |
          set -euo pipefail
          go test ./internal/httpapi -run '^$' -fuzz '^FuzzModule1BearerParserProperties$' -fuzztime=30s -timeout=2m
      - name: Strict auth JSON parser fuzz campaign
        id: auth_json_fuzz
        continue-on-error: true
        run: |
          set -euo pipefail
          go test ./internal/httpapi -run '^$' -fuzz '^FuzzModule1StrictAuthJSONDecoderNeverPanics$' -fuzztime=30s -timeout=2m
      - name: Auth parser fuzz collect-all gate
        if: always()
        env:
          EMAIL_NORMALIZATION_FUZZ: ${{ steps.email_normalization_fuzz.outcome }}
          BEARER_PARSER_FUZZ: ${{ steps.bearer_parser_fuzz.outcome }}
          AUTH_JSON_FUZZ: ${{ steps.auth_json_fuzz.outcome }}
        run: |
          echo "EMAIL_NORMALIZATION_FUZZ=$EMAIL_NORMALIZATION_FUZZ"
          echo "BEARER_PARSER_FUZZ=$BEARER_PARSER_FUZZ"
          echo "AUTH_JSON_FUZZ=$AUTH_JSON_FUZZ"
          test "$EMAIL_NORMALIZATION_FUZZ" = "success"
          test "$BEARER_PARSER_FUZZ" = "success"
          test "$AUTH_JSON_FUZZ" = "success"
