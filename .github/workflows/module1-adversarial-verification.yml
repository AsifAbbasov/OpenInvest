name: Module 1 adversarial auth-session verification

on:
  push:
    branches:
      - audit/module1-auth-session-privacy-strengthened-v2
  pull_request:
    branches:
      - develop
    paths:
      - "backend-go/**"
      - "frontend-next/**"
      - ".github/workflows/module1-adversarial-verification.yml"
      - "docs/audit/MODULE1_AUTH_SESSION_PRIVACY_EVIDENCE_REVALIDATION_V1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module1-adversarial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jwt-structural-fuzz:
    name: jwt-structural-fuzz
    env:
      OPENINVEST_MODULE1_ADVERSARIAL: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Exact-head lock
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "EXPECTED_SHA=$EXPECTED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: JWT fixed adversarial matrix
        id: jwt_fixed
        continue-on-error: true
        run: |
          set -euo pipefail
          go test -race -v ./internal/auth -run '^TestModule1JWT' -count=1
      - name: JWT byte-changing fuzz campaign
        id: jwt_mutation_fuzz
        continue-on-error: true
        run: |
          set -euo pipefail
          go test ./internal/auth -run '^$' -fuzz '^FuzzModule1JWTByteChangingMutationNeverAuthenticates$' -fuzztime=30s -timeout=2m
      - name: JWT structural fuzz campaign
        id: jwt_structural_fuzz
        continue-on-error: true
        run: |
          set -euo pipefail
          go test ./internal/auth -run '^$' -fuzz '^FuzzModule1JWTStructuralParserNeverPanics$' -fuzztime=30s -timeout=2m
      - name: Session lifecycle state-machine fuzz campaign
        id: session_state_fuzz
        continue-on-error: true
        run: |
          set -euo pipefail
          go test ./internal/auth -run '^$' -fuzz '^FuzzModule1SessionLifecycleStateMachine$' -fuzztime=30s -timeout=2m
      - name: JWT and state-machine collect-all gate
        if: always()
        env:
          JWT_FIXED: ${{ steps.jwt_fixed.outcome }}
          JWT_MUTATION_FUZZ: ${{ steps.jwt_mutation_fuzz.outcome }}
          JWT_STRUCTURAL_FUZZ: ${{ steps.jwt_structural_fuzz.outcome }}
          SESSION_STATE_FUZZ: ${{ steps.session_state_fuzz.outcome }}
        run: |
          echo "JWT_FIXED=$JWT_FIXED"
          echo "JWT_MUTATION_FUZZ=$JWT_MUTATION_FUZZ"
          echo "JWT_STRUCTURAL_FUZZ=$JWT_STRUCTURAL_FUZZ"
          echo "SESSION_STATE_FUZZ=$SESSION_STATE_FUZZ"
          test "$JWT_MUTATION_FUZZ" = "success"
          test "$JWT_STRUCTURAL_FUZZ" = "success"
          test "$SESSION_STATE_FUZZ" = "success"
          test "$JWT_FIXED" = "success"

  http-auth-ambiguity:
    name: http-auth-ambiguity
    env:
      OPENINVEST_MODULE1_ADVERSARIAL: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Exact-head lock
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Raw HTTP auth ambiguity matrix
        run: |
          set -euo pipefail
          go test -race -v ./internal/httpapi -run '^TestModule1' -count=1 -timeout=5m

  postgres-session-races:
    name: postgres-session-races
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend-go
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Exact-head lock
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - name: Apply canonical migrations
        working-directory: .
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Run session concurrency and persistent-state matrix
        env:
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
        run: |
          set +e
          failures=0
          run_case() {
            name="$1"
            shift
            echo "::group::$name"
            "$@"
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "CASE_FAILURE=$name RC=$rc"
              failures=$((failures+1))
            fi
          }
          run_case logout_refresh_race go test -race -v ./internal/postgres -run '^TestLogoutRacingRefreshCannotLeaveDescendantActive$' -count=1 -timeout=5m
          run_case replay_descendant_race go test -race -v ./internal/postgres -run '^TestReplayRacingDescendantRefreshLeavesNoActiveFamilyMember$' -count=1 -timeout=5m
          run_case session_family_guard go test -race -v ./internal/postgres -run '^TestDatabaseRejectsNewSessionWithoutFamilyIdentity$' -count=1 -timeout=5m
          run_case registration_enumeration go test -race -v ./internal/postgres -run '^TestModule1Registration' -count=1 -timeout=5m
          run_case cross_principal go test -race -v ./internal/postgres -run '^TestModule1CrossPrincipal' -count=1 -timeout=5m
          run_case bounded_high_contention go test -race -v ./internal/postgres -run '^TestModule1BoundedHighContentionRefreshCampaign\\

  frontend-auth-state:
    name: frontend-auth-state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
      - name: Exact-head lock
        working-directory: .
        env:
