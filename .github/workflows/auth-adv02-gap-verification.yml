name: AUTH-ADV-02 independent gap verification — JWT, CSRF, financial import
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jwt:
    name: "Signed token boundary / ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        case: [CanonicalSignedIdentityContract, FutureIssuedAtPolicy, StructuredInvalidTokenBoundaries]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact baseline and unchanged product bytes
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          BASE=bcfbc2687b60c68b33a8c4b0fbe969952c649d7d
          test "$(git rev-parse "$BASE^{tree}")" = f0d56fb63076a8eaf32bc1f96fe0cdc4928bea96
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/changed
          cat /tmp/changed
          if grep -Ev '^(backend-go/internal/auth/auth_gap_jwt_independent_test.go|backend-go/internal/postgres/auth_gap_(import_ack|session_csrf|browser_seed)_test.go|\.github/workflows/auth-adv02-gap-verification.yml)$' /tmp/changed; then
            echo PRODUCTION_CONTENT_IDENTICAL_TO_PR260=NO
            exit 1
          fi
          echo PRODUCTION_CONTENT_IDENTICAL_TO_PR260=YES
          echo TESTED_SHA=$(git rev-parse HEAD)
          echo TESTED_TREE=$(git rev-parse HEAD^{tree})
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Execute exact JWT test (preserve RED contract failures)
        working-directory: backend-go
        env:
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          TEST="TestAUTHGAPJWT$CASE"
          go test ./internal/auth -list "^$TEST$" | grep -Fx "$TEST"
          go test -race -v ./internal/auth -run "^$TEST$" -count=1 -timeout=5m
  postgres:
    name: "Real PostgreSQL 18 / ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        case: [ImportTwoRowAtomicLostCommitAckAndReplay, RealPostgresCSRFMatrixAndSessionIsolation, RefreshLogoutRacingFinancialWrites]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify strict audit-only diff and product source ancestry
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          BASE=bcfbc2687b60c68b33a8c4b0fbe969952c649d7d
          test "$(git rev-parse "$BASE^{tree}")" = f0d56fb63076a8eaf32bc1f96fe0cdc4928bea96
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD > /tmp/changed
          cat /tmp/changed
          if grep -Ev '^(backend-go/internal/auth/auth_gap_jwt_independent_test.go|backend-go/internal/postgres/auth_gap_(import_ack|session_csrf|browser_seed)_test.go|\.github/workflows/auth-adv02-gap-verification.yml)$' /tmp/changed; then exit 1; fi
          echo PRODUCTION_CONTENT_IDENTICAL_TO_PR260=YES
          echo TESTED_SHA=$(git rev-parse HEAD)
          echo TESTED_TREE=$(git rev-parse HEAD^{tree})
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Migrate synthetic disposable PG18
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Execute exact independent integration test under race detector
        working-directory: backend-go
        env:
          OPENINVEST_CHAOS_ISOLATED: YES_DISPOSABLE_GITHUB_RUNNER
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          TEST="TestAUTHGAP$CASE"
          go test ./internal/postgres -list "^$TEST$" | grep -Fx "$TEST"
          go test -race -v ./internal/postgres -run "^$TEST$" -count=1 -timeout=11m
