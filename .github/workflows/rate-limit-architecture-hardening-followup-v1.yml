name: Audit Rate Limit Architecture Hardening Followup V1

on:
  push:
    branches:
      - audit/rate-limit-architecture-hardening-v1-followup

permissions:
  contents: read

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out followup audit branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Verify protected baseline and unchanged frontend lockfile
        run: |
          set -euo pipefail
          git fetch origin develop
          test "$(git rev-parse origin/develop)" = "5357900e71e1e6f27907f304d59b20490a3b081d"
          test "$(git rev-parse origin/develop^{tree})" = "a5bc1f547055b60958c8306745b5f36872cb762a"
          git diff --quiet 5357900e71e1e6f27907f304d59b20490a3b081d -- frontend-next/pnpm-lock.yaml frontend-next/package.json
          echo "FRONTEND_DEPENDENCY_INPUTS_UNCHANGED=YES"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.8.0 --activate

      - name: Compare patch and baseline pnpm audit
        run: |
          set -euo pipefail
          set +e
          (cd frontend-next && pnpm audit) > "$RUNNER_TEMP/patch-pnpm-audit.txt" 2>&1
          patch_rc=$?
          set -e
          git worktree add --detach "$RUNNER_TEMP/openinvest-baseline" 5357900e71e1e6f27907f304d59b20490a3b081d
          set +e
          (cd "$RUNNER_TEMP/openinvest-baseline/frontend-next" && pnpm audit) > "$RUNNER_TEMP/baseline-pnpm-audit.txt" 2>&1
          baseline_rc=$?
          set -e
          echo "PATCH_PNPM_AUDIT_RC=$patch_rc"
          echo "BASELINE_PNPM_AUDIT_RC=$baseline_rc"
          echo "=== PATCH PNPM AUDIT ==="
          cat "$RUNNER_TEMP/patch-pnpm-audit.txt"
          echo "=== BASELINE PNPM AUDIT ==="
          cat "$RUNNER_TEMP/baseline-pnpm-audit.txt"
          test "$patch_rc" = "$baseline_rc"
          grep -F "source-map-js allows event-loop denial of service" "$RUNNER_TEMP/patch-pnpm-audit.txt"
          grep -F "source-map-js allows event-loop denial of service" "$RUNNER_TEMP/baseline-pnpm-audit.txt"
          echo "DEPENDENCY_SECURITY_SCAN_PATCH_EQUALS_BASELINE=YES"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: microservice-python/uv.lock

      - name: Python tests
        working-directory: microservice-python
        run: |
          uv sync --extra dev --locked
          uv run pytest

      - name: Audit Python dependencies
        working-directory: microservice-python
        run: |
          uv export --frozen --format requirements.txt --all-extras --no-emit-project --output-file /tmp/openinvest-python-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/openinvest-python-requirements.txt --strict --progress-spinner off

      - name: Docker Compose config
        env:
          POSTGRES_PASSWORD: openinvest-ci-config-only
        run: docker compose config --quiet

      - name: Generate remediation-only patch and verify clean apply
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/RATE_LIMITING_ARCHITECTURE_HARDENING_V1.patch"
          git diff --binary 5357900e71e1e6f27907f304d59b20490a3b081d..81d930875eb424256330ab9e35ef611660c57357 --             .             ':(exclude).github/workflows/rate-limit-architecture-hardening-v1.yml'             ':(exclude)scripts/audit-rate-limit-architecture-hardening-v1.py'             > "$patch"
          test -s "$patch"
          sha256sum "$patch"
          echo "=== PATCH STAT ==="
          git diff --stat 5357900e71e1e6f27907f304d59b20490a3b081d..81d930875eb424256330ab9e35ef611660c57357 --             .             ':(exclude).github/workflows/rate-limit-architecture-hardening-v1.yml'             ':(exclude)scripts/audit-rate-limit-architecture-hardening-v1.py'
          echo "=== PATCH NAME STATUS ==="
          git diff --name-status 5357900e71e1e6f27907f304d59b20490a3b081d..81d930875eb424256330ab9e35ef611660c57357 --             .             ':(exclude).github/workflows/rate-limit-architecture-hardening-v1.yml'             ':(exclude)scripts/audit-rate-limit-architecture-hardening-v1.py'
          check="$RUNNER_TEMP/patch-check"
          git worktree add --detach "$check" 5357900e71e1e6f27907f304d59b20490a3b081d
          (cd "$check" && git apply --check "$patch")
          echo "PATCH_APPLY_CHECK=PASS"
          gzip -c "$patch" | base64 -w0 > "$RUNNER_TEMP/patch.gz.b64"
          echo "PATCH_GZIP_BASE64_BEGIN"
          cat "$RUNNER_TEMP/patch.gz.b64"
          echo
          echo "PATCH_GZIP_BASE64_END"
