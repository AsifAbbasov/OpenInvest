name: Module 1 independent auth and email ownership continuation
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial:
    name: "Module1 continuation / ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: JWTClaimsAndIssuerHMAC
            pkg: ./internal/auth
            filter: TestModule1ContinuationJWT
          - case: RealHTTPCookieCSRFAndRevocation
            pkg: ./internal/postgres
            filter: TestModule1ContinuationRealHTTPMultiPrincipalCookieCSRFAndAllSessions
          - case: RealHTTPFinancialBearerIsolation
            pkg: ./internal/postgres
            filter: TestModule1ContinuationRealHTTPBearerSubjectSwapAndLedgerNoMutation
          - case: RealPGExistingAccountTakeover
            pkg: ./internal/postgres
            filter: TestModule1ContinuationActiveAccountReRegistrationCannotTransferFinancialIdentity
          - case: RealPGCompetingProofs
            pkg: ./internal/postgres
            filter: TestModule1ContinuationCompetingValidProofAndMalformedProofs
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact source ancestry, isolated runner, production blob integrity
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          FROZEN=bcfbc2687b60c68b33a8c4b0fbe969952c649d7d
          test "$(git rev-parse "$FROZEN^{tree}")" = f0d56fb63076a8eaf32bc1f96fe0cdc4928bea96
          test "$(git merge-base "$FROZEN" HEAD)" = "$FROZEN"
          git diff --name-only "$FROZEN" HEAD > /tmp/continuation-changes
          cat /tmp/continuation-changes
          if grep -Ev '^(\.github/workflows/module1-auth-continuation\.yml|backend-go/internal/auth/module1_continuation_jwt_contract_test\.go|backend-go/internal/postgres/module1_continuation_real_http_auth_test\.go|backend-go/internal/postgres/module1_continuation_registration_boundary_test\.go)$' /tmp/continuation-changes; then
             echo 'FAIL_UNEXPECTED_PRODUCT_CHANGE'
             exit 1
          fi
          echo PRODUCTION_CONTENT_IDENTICAL_TO_PR260=YES
          echo TESTED_SHA=$(git rev-parse HEAD)
          echo TESTED_TREE=$(git rev-parse HEAD^{tree})
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Apply migrations to disposable PG18 only
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Execute and independently assert real target tests with race detector
        working-directory: backend-go
        env:
          OPENINVEST_CHAOS_ISOLATED: YES_DISPOSABLE_GITHUB_RUNNER
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          CASE: ${{ matrix.filter }}
          PKG: ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          go test "$PKG" -list "^$CASE" | grep -E "^$CASE"
          go test -race -v "$PKG" -run "^$CASE" -count=1 -timeout=8m
