name: Module 1 extended lost ACK evidence
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ack-interception:
    name: "Real PostgreSQL ACK loss / ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        case: [AckLossRealRegistrationStore, NormalCommitControl, RealHTTPActivationThroughThreePostgresKills, FinancialHTTPLostCommitAckIdempotentRetry, FinancialTradesWACAcrossThreeRealCrashes]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: openinvest
          POSTGRES_USER: openinvest
          POSTGRES_PASSWORD: openinvest-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openinvest -d openinvest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate exact SHA and isolated runner
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          echo "TESTED_SHA=$(git rev-parse HEAD)"
          echo "TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - name: Migrate disposable PostgreSQL
        run: |
          set -euo pipefail
          OPENINVEST_DATABASE_OWNER_URL='postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable' bash scripts/apply-migrations.sh
      - name: Pin disposable PostgreSQL service for real SIGKILL
        run: |
          set -euo pipefail
          docker ps --filter ancestor=postgres:18 --format '{{.ID}}' > /tmp/extended-pg
          test "$(wc -l < /tmp/extended-pg)" -eq 1
          ID="$(cat /tmp/extended-pg)"
          test "$(docker inspect --format '{{.Config.Image}}' "$ID")" = "postgres:18"
          echo "OPENINVEST_CHAOS_PG_CONTAINER=$ID" >> "$GITHUB_ENV"
      - name: Execute scenario with actual PostgreSQL
        working-directory: backend-go
        env:
          OPENINVEST_CHAOS_ISOLATED: YES_DISPOSABLE_GITHUB_RUNNER
          OPENINVEST_DATABASE_TEST_URL: postgres://openinvest:openinvest-ci@127.0.0.1:5432/openinvest?sslmode=disable
          CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          TEST="TestModule1Extended$CASE"
          go test ./internal/postgres -list "^$TEST$" | grep -Fx "$TEST"
          go test -race -v ./internal/postgres -run "^$TEST$" -count=1 -timeout=10m
