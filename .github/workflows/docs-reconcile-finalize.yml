name: Final documentation consistency pass

on:
  push:
    branches:
      - docs/repository-documentation-reconciliation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: docs/repository-documentation-reconciliation
          fetch-depth: 0
      - name: Fix final lifecycle wording
        shell: python
        run: |
          from pathlib import Path

          p = Path('docs/IMPLEMENTATION_LOG.md')
          t = p.read_text()
          old = '| 3.32 — Exact Idempotency Replay and Browser Retry Recovery | Remediate audit P2-09/P2-13 across exact original-response replay and browser retry continuity/isolation | Implementation merged through PR #67 at `0623d5ef326cd783b7dc0417dbcb02f18c506171` after CI #181 and repeat independent `APPROVED`; closure governance closes the findings when canonical and leaves 5 P2 plus 10 P3 | [Stage 3.32 report](stages/STAGE_03_32_IDEMPOTENCY_REPLAY_BROWSER_RECOVERY.md) |'
          new = '| 3.32 — Exact Idempotency Replay and Browser Retry Recovery | Remediate audit P2-09/P2-13 across exact original-response replay and browser retry continuity/isolation | Complete / closure canonical through PR #68 at `a73b7f8c008d2f903e22e9b8a85b7c6248d6d3be`; P2-09/P2-13 CLOSED; later Stages 3.33–3.56 closed the remaining original audit backlog | [Stage 3.32 report](stages/STAGE_03_32_IDEMPOTENCY_REPLAY_BROWSER_RECOVERY.md) |'
          if t.count(old) != 1:
              raise SystemExit('Stage 3.32 implementation-log anchor mismatch')
          p.write_text(t.replace(old, new, 1))

          for filename in [
              'docs/audit/REPOSITORY_AUDIT_REMEDIATION_REGISTER.md',
              'docs/governance/REPOSITORY_DOCUMENTATION_RECONCILIATION.md',
          ]:
              p = Path(filename)
              t = p.read_text()
              old = '| Status | CLOSED / CANONICAL ON PROTECTED `develop` |' if 'AUDIT_' in filename else '| Status | CANONICAL ON PROTECTED `develop` |'
              new = '| Status | MERGE-ACTIVATED — CANONICAL ONLY AFTER PROTECTED MERGE |'
              if t.count(old) != 1:
                  raise SystemExit(f'{filename}: status anchor mismatch')
              p.write_text(t.replace(old, new, 1))

          Path('.github/workflows/docs-reconcile-finalize.yml').unlink()
      - name: Verify final diff scope
        run: |
          changed="$(git status --porcelain=v1 | sed -E 's/^.. //')"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(docs/.*|\.github/workflows/docs-reconcile-finalize\.yml)$'; then
            echo 'Unexpected path changed' >&2
            exit 1
          fi
      - name: Commit final documentation consistency pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize reconciliation lifecycle wording'
          git push origin HEAD:docs/repository-documentation-reconciliation
